/* ===== shared/common.css ===== */
/* FlotaIA · estilos compartidos por Mobile y Tablet.
   Mismo sistema visual que el escritorio V13 «Cinta reflectiva»: asfalto, concreto y amarillo de señalización. */
:root{
  color-scheme:light;
  --asfalto:#1F2A2E; --asfalto-2:#2A373C; --asfalto-3:#3A4A50;
  --concreto:#EDEFEB; --concreto-2:#E3E6E1; --blanco:#FFFFFF;
  --senal:#F2B300; --senal-hover:#DFA400; --senal-soft:#FFF4CF;
  --petroleo:#2B5D6E; --petroleo-soft:#E3EEF1;
  --surface:#FFFFFF; --surface-2:#F6F7F4;
  --ink:#1B2427; --ink-2:#34434A; --muted:#5C6A6F; --faint:#88959A;
  --line:#D6DAD4; --line-2:#C2C8C1;
  --good:#2F7A4E; --good-soft:#E3F1E8; --warn:#A86E0B; --warn-soft:#FBF0D9; --crit:#B83A2A; --crit-soft:#F8E4E0;
  --ia:#5B4BB7; --ia-soft:#ECE9F8; --auto:#2B5D6E; --auto-soft:#E3EEF1; --sim:#7A5A12; --sim-soft:#F5EDD8;
  --sans:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Semi Condensed","Barlow","Arial Narrow",sans-serif;
  --code:"IBM Plex Mono",Consolas,monospace;
  --chevron:repeating-linear-gradient(-45deg,var(--senal) 0 12px,var(--asfalto) 12px 24px);
  --r-sm:4px; --r:6px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--concreto);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--cond);color:var(--ink);margin:0;line-height:1.15}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--petroleo)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
::selection{background:var(--senal-soft)}
:where(a,button,select,input,textarea,[tabindex]):focus-visible{outline:2px solid var(--asfalto);outline-offset:2px;box-shadow:0 0 0 5px var(--senal)}

/* ---------- franja de MODO LOCAL: nunca se confunde con Firebase ---------- */
.modo-local{position:sticky;top:0;z-index:90;background:var(--crit);color:#fff;font-family:var(--cond);font-weight:700;font-size:.9rem;line-height:1.25;
  padding:calc(5px + var(--safe-t)) calc(12px + var(--safe-r)) 5px calc(12px + var(--safe-l));display:flex;gap:2px 10px;flex-wrap:wrap;align-items:center;justify-content:center;text-align:center}
.modo-local span{font-family:var(--sans);font-weight:500;font-size:.74rem;opacity:.95}
.modo-local button{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:var(--r-sm);font-size:.74rem;padding:1px 8px;cursor:pointer;font-family:var(--sans)}
@media (max-width:640px){.modo-local span{order:3;flex-basis:100%}}

/* ---------- barra superior con borde de cinta reflectiva ---------- */
.topbar{background:var(--asfalto);color:#fff;position:relative;padding:10px calc(16px + var(--safe-r)) 18px calc(16px + var(--safe-l));display:flex;align-items:center;gap:12px}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--chevron)}
.has-safe-top .topbar{padding-top:calc(10px + var(--safe-t))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.bname{font-family:var(--cond);font-size:1.35rem;font-weight:700;color:#fff;line-height:1}
.bname span{color:var(--senal)}
.bsub{font-size:.72rem;color:#A4B0AD;line-height:1.2;margin-top:2px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.chip-rol{font-family:var(--cond);font-size:.88rem;font-weight:600;background:var(--asfalto-3);color:#fff;border-radius:3px;padding:3px 8px;white-space:nowrap}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:var(--r-sm);border:1px solid #4B5B61;background:transparent;color:#E6EBE9;cursor:pointer}
.iconbtn:hover{background:var(--asfalto-2)}

/* indicador de conexión: solo describe lo que informa el SDK */
.conn{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:#D3DAD8;white-space:nowrap}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint)}
.conn.ok::before{background:#5FC28A}
.conn.cache::before{background:var(--senal)}
.conn.off::before{background:#F2A597}
.conn.local::before{background:#F2A597}

.proto-band{background:var(--sim-soft);color:var(--sim);font-size:.8rem;font-weight:600;padding:6px calc(16px + var(--safe-r)) 6px calc(16px + var(--safe-l));display:flex;flex-wrap:wrap;gap:2px 10px}
.proto-band b{font-family:var(--cond);font-weight:700}

/* ---------- superficies ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 12px;flex-wrap:wrap}
.card-h p{color:var(--muted);font-size:.86rem;margin-top:2px}
.eyebrow{font-size:.82rem;font-weight:600;color:var(--petroleo)}
.vhead{display:grid;gap:4px;margin-bottom:4px}
.vhead .lead{color:var(--ink-2);font-size:.95rem;max-width:70ch}
.foot{font-size:.8rem;color:var(--muted)}
.note{background:var(--surface-2);border-left:4px solid var(--petroleo);padding:10px 12px;font-size:.88rem;color:var(--ink-2)}
.note.crit{border-left-color:var(--crit);background:var(--crit-soft)}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.good{border-left-color:var(--good);background:var(--good-soft)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 16px;position:relative;display:grid;gap:2px;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:var(--r) 0 0 var(--r);background:var(--kc,var(--line-2))}
.kpi .l{font-size:.82rem;color:var(--muted)}
.kpi .v{font-family:var(--cond);font-size:1.9rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .m{font-size:.78rem;color:var(--muted)}
.kpi.crit{--kc:var(--crit)}.kpi.warn{--kc:var(--senal)}.kpi.good{--kc:var(--good)}.kpi.auto{--kc:var(--petroleo)}

/* ---------- botones y controles (objetivo táctil ≥ 44 px) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:var(--r-sm);
  background:var(--senal);border:1px solid var(--senal);color:var(--asfalto);font-family:var(--cond);font-size:1.05rem;font-weight:600;cursor:pointer;text-decoration:none;touch-action:manipulation}
.btn:hover{background:var(--senal-hover);border-color:var(--senal-hover)}
.btn.sec{background:var(--surface);border-color:var(--line-2);color:var(--asfalto)}
.btn.sec:hover{background:var(--surface-2);border-color:var(--asfalto)}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.btn.dark{background:var(--asfalto);border-color:var(--asfalto);color:#fff}
.btn.danger{background:var(--surface);color:var(--crit);border-color:#E2B4AC}
.btn.sm{min-height:38px;font-size:.95rem;padding:6px 12px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn .spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.f{display:grid;gap:5px;font-size:.9rem;font-weight:600;color:var(--ink-2);min-width:0}
.f .hint{font-weight:400;color:var(--muted);font-size:.8rem}
input,select,textarea{width:100%;min-height:46px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;padding:10px 12px;font-size:16px;font-weight:400;color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.45}
input:disabled,select:disabled{background:var(--surface-2);color:var(--muted)}
.f.has-err input,.f.has-err select,.f.has-err textarea{border-color:var(--crit);background:#FFFBFA}
.ferr{color:var(--crit);font-size:.82rem;font-weight:600;min-height:0}
.ferr:empty{display:none}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

<script type="module">

const FIREBASE_SDK = '10.12.2';

return { firebaseConfig, FIREBASE_SDK, configCompleta };
})();

// ===== reglas.js =====
__M['reglas'] = (() => {
// FlotaIA · clasificación del reporte por REGLAS (no es IA).
// Copia exacta de la función reglas() del escritorio index.html V13.1; tests/equivalencia.test.mjs comprueba que dan el mismo resultado.
function reglas(t) {
  const x = t.toLowerCase();
  const sistema = /bomba|prensa|hidr|aceite|cilindro|compuerta|fuga|acumulador|enfriador|pala|manguera/.test(x) ? 'Hidráulico'
    : /motor|humo|escape|arranca|temperatura|recalienta|turbo/.test(x) ? 'Motor'
    : /luz|luces|bater|eléctr|electr|tablero|alternador|fusible/.test(x) ? 'Eléctrico'
    : /llanta|neum|freno|suspens|dirección|direccion/.test(x) ? 'Chasis' : 'Por confirmar';
  const prioridad = /no (puede )?sal|no arranca|varad|detenid|no funciona|no sale|sin frenos/.test(x) ? 'alta'
    : /pierde|ruido|silbido|fuga|humo|recalienta|goteo/.test(x) ? 'media' : 'baja';
  const acc = { 'Hidráulico': 'Inspeccionar bomba, mangueras y cilindros; medir presión del sistema', 'Motor': 'Diagnóstico del motor por el mecánico de turno', 'Eléctrico': 'Revisar fusibles, batería y cableado', 'Chasis': 'Revisar frenos, dirección y neumáticos', 'Por confirmar': 'Inspección general por el mecánico de turno' }[sistema];
  return { sistema, prioridad, accion: acc };
}
const SISTEMAS = ['Hidráulico', 'Motor', 'Eléctrico', 'Chasis', 'Por confirmar'];
const EJEMPLOS = [
  ['Prensa sin fuerza', 'La prensa pierde fuerza y se escucha un silbido en la bomba'],
  ['Humo en el motor', 'Sale humo negro del escape y el motor no levanta en subida'],
  ['Fuga, no sale', 'Fuga de aceite en el cilindro de la compuerta, la unidad no puede salir a ruta'],

})();

// ===== permissions.js =====
__M['permissions'] = (() => {
// FlotaIA · permisos por rol.
// Esta matriz decide qué muestra la interfaz. La protección real la aplican las reglas de Firestore (firestore.rules),
// que repiten las mismas restricciones: ocultar un botón no protege la base de datos.

const ROLES = ['chofer', 'mecanico', 'supervisor', 'administrador'];
const ROL_NOMBRE = { chofer: 'Chofer', mecanico: 'Mecánico', supervisor: 'Supervisor', administrador: 'Administrador' };

const T = true, F = false;
const MATRIZ = {
  //                         chofer       mecánico  supervisor  administrador
  verTodasLasUnidades:     { chofer: F,         mecanico: T, supervisor: T, administrador: T },
  reportarIncidencia:      { chofer: T,         mecanico: T, supervisor: T, administrador: T },
  verAlertas:              { chofer: T,         mecanico: T, supervisor: T, administrador: T },
  registrarInspeccion:     { chofer: F,         mecanico: T, supervisor: T, administrador: T },
  atenderOrden:            { chofer: F,         mecanico: T, supervisor: F, administrador: T },
  observarSeguimiento:     { chofer: F,         mecanico: T, supervisor: T, administrador: T },
  generarOrdenModelo:      { chofer: F,         mecanico: T, supervisor: F, administrador: T },
  verIndicadores:          { chofer: 'limitado', mecanico: T, supervisor: T, administrador: T },
  administrarUsuarios:     { chofer: F,         mecanico: F, supervisor: F, administrador: T },
};

function puede(rol, accion) {
  const fila = MATRIZ[accion];
  if (!fila || !ROLES.includes(rol)) return false;
  return fila[rol];
}

// Qué perfiles usa cada interfaz (el administrador puede entrar a ambas).
const PERFILES_INTERFAZ = {
  mobile: ['chofer', 'mecanico', 'administrador'],
  tablet: ['mecanico', 'supervisor', 'administrador'],
};
return { ROLES, ROL_NOMBRE, puede, PERFILES_INTERFAZ };
})();

// ===== firestore-service.js =====
__M['firestore-service'] = (() => {
// FlotaIA · servicio de datos compartido por Mobile y Tablet.
// Toda lectura y escritura pasa por aquí. La forma de cada documento coincide campo por campo con firestore.rules.
// Funciona igual con el adaptador de Firestore o con el modo local de prueba.
const { reglas, SISTEMAS } = __M['reglas'];
const { puede } = __M['permissions'];

let A = null;
const usarAdaptador = a => { A = a; };
const adaptador = () => A;

const ESTADOS = { pendiente: 'Pendiente', atencion: 'En atención', resuelta: 'Resuelta' };
const PRIORIDADES = ['alta', 'media', 'baja'];
const CONDICIONES = { conforme: 'Conforme', observada: 'Observada', critica: 'Crítica' };
const RESULTADO_POR_CONDICION = { conforme: 'apta', observada: 'apta_con_observacion', critica: 'no_apta' };
const RESULTADOS = { apta: 'Apta', apta_con_observacion: 'Apta con observación', no_apta: 'No apta: no sale a ruta' };
const PRIORIDAD_POR_CONDICION = { observada: 'media', critica: 'alta' };
// Mismas acciones que asigna reglas() en el escritorio para cada sistema.
const ACCION_POR_SISTEMA = { 'Hidráulico': 'Inspeccionar bomba, mangueras y cilindros; medir presión del sistema', 'Motor': 'Diagnóstico del motor por el mecánico de turno', 'Eléctrico': 'Revisar fusibles, batería y cableado', 'Chasis': 'Revisar frenos, dirección y neumáticos', 'Por confirmar': 'Inspección general por el mecánico de turno' };
const UNIDADES_CATALOGO = [...Array.from({ length: 7 }, (_, i) => ({ codigo: `C-0${i + 1}`, tipo: 'compactadora', ruta: `R-0${i + 1}` })), { codigo: 'B-01', tipo: 'baranda', ruta: null }];

const p2 = n => String(n).padStart(2, '0');
// Código legible sin contador global (evita transacciones y choques entre dispositivos): OT-AAMMDD-HHMM-XXX.
function codigoOT(id, f = new Date()) {
  return `OT-${String(f.getFullYear()).slice(2)}${p2(f.getMonth() + 1)}${p2(f.getDate())}-${p2(f.getHours())}${p2(f.getMinutes())}-${id.replace(/[^a-z0-9]/gi, '').slice(0, 3).toUpperCase()}`;
}
const err = (code, msg) => { const e = new Error(msg); e.code = code; return e; };
const firma = perfil => ({ uid: perfil.uid, codigo: perfil.codigo, rol: perfil.rol });
// Transacciones (tomar o cerrar una orden) requieren conexión: así dos mecánicos no toman la misma orden sin enterarse.
const exigirConexion = () => { if (A.nombre === 'firestore' && !navigator.onLine) throw err('flotaia/sin-conexion', 'Iniciar o cerrar una orden requiere conexión, para que dos mecánicos no tomen la misma orden. Inténtelo cuando tenga señal.'); };

// ---------- reporte de falla: incidencia + orden de trabajo + seguimiento, en un solo lote ----------
function validarReporte(perfil, d) {
  const e = {};
  if (!d.unidadId) e.unidadId = 'Elija la compactadora.';
  else if (perfil.rol === 'chofer' && d.unidadId !== perfil.unidadAsignada) e.unidadId = 'Solo puede reportar sobre su unidad asignada.';
  const t = String(d.descripcion || '').trim();
  if (t.length < 8) e.descripcion = 'Describa la falla con al menos 8 caracteres.';
  else if (t.length > 400) e.descripcion = 'Máximo 400 caracteres.';
  if (String(d.observaciones || '').length > 400) e.observaciones = 'Máximo 400 caracteres.';
  return e;
}
function nuevosIdsReporte() { return { inc: A.newId(['incidencias']), ot: A.newId(['ordenes_trabajo']), seg: A.newId(['ordenes_trabajo', 'x', 'seguimiento']) }; }

async function crearReporte(perfil, d, ids, origen) {
  if (!puede(perfil.rol, 'reportarIncidencia')) throw err('flotaia/permiso', 'Su perfil no puede reportar incidencias.');
  const e = validarReporte(perfil, d); if (Object.keys(e).length) throw Object.assign(err('flotaia/validacion', 'Revise los campos marcados.'), { campos: e });
  const descripcion = String(d.descripcion).trim(), c = reglas(descripcion), sistema = c.sistema;

  const ops = [
    { op: 'set', path: ['incidencias', ids.inc], data: { unidadId: d.unidadId, sistema, descripcion, observaciones: String(d.observaciones || '').trim(), prioridad: c.prioridad, prioridadOrigen: 'reglas', origen, autorUid: f.uid, autorCodigo: f.codigo, autorRol: f.rol, otId: ids.ot, creadoEn: ts, prototipo: true } },
    { op: 'set', path: ['ordenes_trabajo', ids.ot], data: nuevaOT({ codigo, unidadId: d.unidadId, sistema, prioridad: c.prioridad, accion: ACCION_POR_SISTEMA[sistema], resumen: descripcion, origen: 'incidencia', incidenciaId: ids.inc, inspeccionId: null, motor: 'reglas', detalleModelo: null }, f, ts) },

  const pintar = () => {
    if (A.nombre === 'local') { el.className = 'conn local'; el.textContent = 'Modo local · sin Firebase'; return; }
    if (!est.online) { el.className = 'conn off'; el.textContent = est.pendientes ? 'Sin conexión · cambios por enviar' : 'Sin conexión · datos del equipo'; return; }
    if (est.fromCache) { el.className = 'conn cache'; el.textContent = 'Conectando con Firestore…'; return; }
    el.className = 'conn ok'; el.textContent = est.pendientes ? 'En línea · enviando cambios' : 'En línea · Firestore';
  };
  const pintarT = () => { pintar(); el.title = el.textContent; };
  A.onConexion(c => { est.online = c.online; pintarT(); });
  pintarT();
  return meta => { if (meta) { est.fromCache = meta.fromCache; est.pendientes = meta.pendientes; } pintarT(); };
}

// ---------- formularios ----------
function marcarErrores(form, campos = {}) {
  $$('.f', form).forEach(f => { f.classList.remove('has-err'); const e = $('.ferr', f); if (e) e.textContent = ''; });
  let primero = null;
  Object.entries(campos).forEach(([k, msg]) => {
    const inp = form.querySelector(`[name="${k}"]`); if (!inp) return;
    const f = inp.closest('.f'); if (!f) return;
    f.classList.add('has-err'); let e = $('.ferr', f);
    if (!e) { e = document.createElement('span'); e.className = 'ferr'; f.append(e); }
    e.textContent = msg; inp.setAttribute('aria-invalid', 'true');
    if (!primero) primero = inp;
  });
  if (primero) primero.focus();
}
function ocupado(btn, on, texto) {
  if (on) { btn.dataset.txt = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin" aria-hidden="true"></span>${esc(texto || 'Enviando…')}`; }
  else { btn.disabled = false; if (btn.dataset.txt) btn.innerHTML = btn.dataset.txt; }
}

// ---------- hoja inferior / diálogo ----------
function hoja(titulo, html, { onClose } = {}) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><div class="sheet-h"><h2>${esc(titulo)}</h2><button type="button" class="iconbtn" style="color:var(--ink);border-color:var(--line-2)" aria-label="Cerrar">${ic('x')}</button></div><div class="sheet-b" style="display:grid;gap:12px">${html}</div></div>`;
  const previo = document.activeElement;
  const cerrar = () => { bg.remove(); document.removeEventListener('keydown', tecla); if (onClose) onClose(); if (previo && previo.focus) previo.focus(); };
  const tecla = e => { if (e.key === 'Escape') cerrar(); };
  bg.addEventListener('click', e => { if (e.target === bg) cerrar(); });
  bg.querySelector('.sheet-h button').onclick = cerrar;
  document.addEventListener('keydown', tecla);
  document.body.append(bg);
  setTimeout(() => (bg.querySelector('.sheet-b [autofocus]') || bg.querySelector('.sheet-h button')).focus(), 0);
  return { el: bg.querySelector('.sheet-b'), cerrar };
}

  const botonSalir = '<button type="button" class="btn sec" data-salir>Cerrar sesión</button>';

          onSubmit: async (email, pass) => { try { await iniciarSesion(email, pass); } catch (e) { e.mensaje = mensajeError(e); throw e; } } }));
        return;

        ? `El perfil de ${esc(ROL_NOMBRE[p.rol].toLowerCase())} trabaja en la tablet: seguimiento operativo, inspecciones e indicadores.`
        : `El perfil de ${esc(ROL_NOMBRE[p.rol].toLowerCase())} trabaja en el celular: reporte de fallas y seguimiento de sus reportes.`,
        acciones: `<a class="btn" href="../${OTRA}/${Q}">Abrir FlotaIA ${OTRA === 'mobile' ? 'Mobile' : 'Tablet'}</a>${botonSalir}` });
      enlazarSalir(); return;

}

function completarPerfil(root, p, botonSalir) {

  const f = $('.estado-sesion form', root);

    const d = { rol: 'administrador', activo: true, nombre: f.nombre.value, codigo: f.codigo.value.trim().toUpperCase(), unidadAsignada: null };
    const errs = S.validarPerfil(d, []); if (Object.keys(errs).length) { marcarErrores(f, errs); return; }

      $('[data-ins]', el).innerHTML = D.insp.length ? D.insp.slice(0, 5).map(i => `<div class="row" style="cursor:default;grid-template-columns:1fr auto"><span class="t">${esc(i.sistema)} · ${esc(S.CONDICIONES[i.condicion])}</span><span class="r">${pillResultado(i.resultado)}</span><span class="s" style="grid-column:1/3">${esc(fFecha(i.creadoEn))} · ${esc(i.responsableCodigo)}${i.observaciones ? ' · ' + esc(i.observaciones) : ''}</span></div>`).join('') : vacio('Sin inspecciones registradas.');
      const r = unidadDe(u);
      $('[data-ficha]', el).innerHTML = r ? `<dt>Código</dt><dd class="num">${esc(r.codigo)}</dd><dt>Tipo</dt><dd>${esc(r.tipo === 'compactadora' ? 'Compactadora' : 'Camión baranda')}</dd><dt>Ruta</dt><dd>${esc(r.ruta || 'Sin ruta fija')}</dd>` : '<dt>Unidad</dt><dd>Catálogo de unidades no inicializado.</dd>';
    },
  },
  reportar: {
    montar(el) {
      el.innerHTML = '<div data-error></div><div data-frm style="display:grid;gap:14px"></div>';
      frmReporte = formularioReporte($('[data-frm]', el), perfil, { origen: 'mobile', unidades: D.unidades, onVer: id => abrirDetalle(id) });
    },
    actualizar() { if (frmReporte && perfil.rol !== 'chofer' && document.activeElement?.name !== 'unidadId') frmReporte.unidades(D.unidades); },
  },
  reportes: {
    montar(el) {
      el.innerHTML = `<div class="vhead"><div class="eyebrow">Seguimiento</div><h1>Mis reportes</h1><p class="lead">Toque un reporte para ver su avance en tiempo real.</p></div><div data-error></div>
        ${seg('Filtrar reportes', [['todos', 'Todos'], ['abiertos', 'Abiertos'], ['resueltos', 'Resueltos']], filtros.reportes)}<div class="list" data-l></div>`;
      enlazarSeg(el, v => { filtros.reportes = v; refrescar(); });
    },
    actualizar(el) {
      const f = filtros.reportes, L = D.ordenes.filter(o => f === 'todos' || (f === 'abiertos' ? o.estado !== 'resuelta' : o.estado === 'resuelta')).sort(recientes);
      $('[data-l]', el).innerHTML = cargando() || (L.length ? L.map(o => filaOrden(o)).join('') : vacio(f === 'todos' ? 'Todavía no ha enviado reportes.' : 'No hay reportes en este grupo.'));
    },
  },
  ordenes: {
    montar(el) {
      el.innerHTML = `<div class="vhead"><div class="eyebrow">${esc(ROL_NOMBRE[perfil.rol])} · ${esc(perfil.codigo)}</div><h1>Órdenes de trabajo</h1><p class="lead">Ordenadas por prioridad. Toque una orden para atenderla.</p></div><div data-error></div>
        <div class="filtros"><div data-seg></div><label class="f">Unidad<select data-u></select></label></div><div class="list" data-l></div>`;
      $('[data-u]', el).onchange = e => { filtros.unidad = e.target.value; refrescar(); };
    },
    actualizar(el) {
      const yo = perfil.uid, ab = D.ordenes.filter(o => o.estado !== 'resuelta');
      const grupos = { disponibles: ab.filter(o => o.estado === 'pendiente'), mias: ab.filter(o => o.estado === 'atencion' && o.mecanicoUid === yo), abiertas: ab };
      $('[data-seg]', el).innerHTML = seg('Grupo de órdenes', [['disponibles', `Pendientes (${grupos.disponibles.length})`], ['mias', `Mías (${grupos.mias.length})`], ['abiertas', `Abiertas (${ab.length})`]], filtros.ordenes);
      enlazarSeg(el, v => { filtros.ordenes = v; refrescar(); });
      pintarSelectUnidad($('[data-u]', el));
      const L = grupos[filtros.ordenes].filter(o => !filtros.unidad || o.unidadId === filtros.unidad).sort(porPrioridad);
      $('[data-l]', el).innerHTML = cargando() || (L.length ? L.map(o => filaOrden(o)).join('') : vacio({ disponibles: 'No hay órdenes pendientes.', mias: 'No tiene órdenes en atención.', abiertas: 'No hay órdenes abiertas.' }[filtros.ordenes], 'check'));
    },
  },
  historial: {
    montar(el) {
      el.innerHTML = `<div class="vhead"><div class="eyebrow">Taller</div><h1>Historial</h1><p class="lead">Órdenes resueltas, de la más reciente a la más antigua.</p></div><div data-error></div>
        <label class="f">Unidad<select data-u></select></label><div class="mini3" data-k></div><div class="list" data-l></div>`;
      $('[data-u]', el).onchange = e => { filtros.unidad = e.target.value; refrescar(); };
    },
    actualizar(el) {
      pintarSelectUnidad($('[data-u]', el));
      const R = D.ordenes.filter(o => o.estado === 'resuelta' && (!filtros.unidad || o.unidadId === filtros.unidad)).sort((a, b) => String(b.resueltaEn).localeCompare(String(a.resueltaEn)));
      const mias = R.filter(o => o.mecanicoUid === perfil.uid).length, mttr = R.length ? R.reduce((s, o) => s + (Number(o.horasReparacion) || 0), 0) / R.length : null;
      $('[data-k]', el).innerHTML = `<div class="kpi good"><span class="l">Resueltas</span><span class="v">${R.length}</span></div><div class="kpi auto"><span class="l">Por usted</span><span class="v">${mias}</span></div><div class="kpi"><span class="l">Reparación media</span><span class="v" style="font-size:1.3rem">${esc(fHoras(mttr))}</span></div>`;
      $('[data-l]', el).innerHTML = cargando() || (R.length ? R.map(o => filaOrden(o)).join('') : vacio('Todavía no hay órdenes resueltas.'));
    },
  },
  alertas: {
    montar(el) {
      el.innerHTML = `<div class="vhead"><div class="eyebrow">Avisos</div><h1>Alertas</h1><p class="lead">${perfil.rol === 'chofer' ? 'Estado de su unidad y avance de sus reportes.' : 'Órdenes que requieren atención y unidades fuera de ruta.'} Se calculan con las operaciones registradas.</p></div><div data-error></div><div data-l></div>`;
      el.dataset.visto = leerVisto();
    },
    actualizar(el) {
      const al = perfil.rol === 'chofer' ? alertasChofer(perfil, D.ordenes, D.ordenesUnidad, D.insp) : alertasTaller(D.ordenes);
      $('[data-l]', el).innerHTML = cargando() || listaAlertas(al, el.dataset.visto);
    },
  },
};
function pintarSelectUnidad(sel) {
  if (document.activeElement === sel) return;
  const ops = D.unidades.map(u => u.codigo);
  sel.innerHTML = '<option value="">Todas</option>' + ops.map(c => `<option${c === filtros.unidad ? ' selected' : ''}>${esc(c)}</option>`).join('');
}

/* ===== shared/common.css ===== */
/* FlotaIA · estilos compartidos por Mobile y Tablet.
   Mismo sistema visual que el escritorio V13 «Cinta reflectiva»: asfalto, concreto y amarillo de señalización. */
:root{
  color-scheme:light;
  --asfalto:#1F2A2E; --asfalto-2:#2A373C; --asfalto-3:#3A4A50;
  --concreto:#EDEFEB; --concreto-2:#E3E6E1; --blanco:#FFFFFF;
  --senal:#F2B300; --senal-hover:#DFA400; --senal-soft:#FFF4CF;
  --petroleo:#2B5D6E; --petroleo-soft:#E3EEF1;
  --surface:#FFFFFF; --surface-2:#F6F7F4;
  --ink:#1B2427; --ink-2:#34434A; --muted:#5C6A6F; --faint:#88959A;
  --line:#D6DAD4; --line-2:#C2C8C1;
  --good:#2F7A4E; --good-soft:#E3F1E8; --warn:#A86E0B; --warn-soft:#FBF0D9; --crit:#B83A2A; --crit-soft:#F8E4E0;
  --ia:#5B4BB7; --ia-soft:#ECE9F8; --auto:#2B5D6E; --auto-soft:#E3EEF1; --sim:#7A5A12; --sim-soft:#F5EDD8;
  --sans:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Semi Condensed","Barlow","Arial Narrow",sans-serif;
  --code:"IBM Plex Mono",Consolas,monospace;
  --chevron:repeating-linear-gradient(-45deg,var(--senal) 0 12px,var(--asfalto) 12px 24px);
  --r-sm:4px; --r:6px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);

let cajaToasts;
function toast(msg, tipo = '', ms = 4200) {
  if (!cajaToasts) { cajaToasts = document.createElement('div'); cajaToasts.className = 'toasts'; cajaToasts.setAttribute('role', 'status'); cajaToasts.setAttribute('aria-live', 'polite'); document.body.append(cajaToasts); }

  t.innerHTML = `<span>${esc(msg)}</span><button type="button" aria-label="Cerrar aviso">×</button>`;
  t.querySelector('button').onclick = () => t.remove();
  cajaToasts.append(t);
  if (ms) setTimeout(() => t.remove(), ms);

// ---------- indicador de conexión (solo lo que informa el SDK; en modo local lo dice) ----------
function indicadorConexion(el, A) {
  const est = { online: navigator.onLine, fromCache: true, pendientes: false };
  const pintar = () => {
    if (A.nombre === 'local') { el.className = 'conn local'; el.textContent = 'Modo local · sin Firebase'; return; }
    if (!est.online) { el.className = 'conn off'; el.textContent = est.pendientes ? 'Sin conexión · cambios por enviar' : 'Sin conexión · datos del equipo'; return; }
    if (est.fromCache) { el.className = 'conn cache'; el.textContent = 'Conectando con Firestore…'; return; }
    el.className = 'conn ok'; el.textContent = est.pendientes ? 'En línea · enviando cambios' : 'En línea · Firestore';
  };
  const pintarT = () => { pintar(); el.title = el.textContent; };
  A.onConexion(c => { est.online = c.online; pintarT(); });
  pintarT();
  return meta => { if (meta) { est.fromCache = meta.fromCache; est.pendientes = meta.pendientes; } pintarT(); };
}

function marcarErrores(form, campos = {}) {
  $$('.f', form).forEach(f => { f.classList.remove('has-err'); const e = $('.ferr', f); if (e) e.textContent = ''; });
  let primero = null;
  Object.entries(campos).forEach(([k, msg]) => {
    const inp = form.querySelector(`[name="${k}"]`); if (!inp) return;
    const f = inp.closest('.f'); if (!f) return;
    f.classList.add('has-err'); let e = $('.ferr', f);
    if (!e) { e = document.createElement('span'); e.className = 'ferr'; f.append(e); }

}
function ocupado(btn, on, texto) {

  else { btn.disabled = false; if (btn.dataset.txt) btn.innerHTML = btn.dataset.txt; }
}

// ---------- hoja inferior / diálogo ----------
function hoja(titulo, html, { onClose } = {}) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><div class="sheet-h"><h2>${esc(titulo)}</h2><button type="button" class="iconbtn" style="color:var(--ink);border-color:var(--line-2)" aria-label="Cerrar">${ic('x')}</button></div><div class="sheet-b" style="display:grid;gap:12px">${html}</div></div>`;
  const previo = document.activeElement;
  const cerrar = () => { bg.remove(); document.removeEventListener('keydown', tecla); if (onClose) onClose(); if (previo && previo.focus) previo.focus(); };
  const tecla = e => { if (e.key === 'Escape') cerrar(); };
  bg.addEventListener('click', e => { if (e.target === bg) cerrar(); });
  bg.querySelector('.sheet-h button').onclick = cerrar;
  document.addEventListener('keydown', tecla);
  document.body.append(bg);
  setTimeout(() => (bg.querySelector('.sheet-b [autofocus]') || bg.querySelector('.sheet-h button')).focus(), 0);
  return { el: bg.querySelector('.sheet-b'), cerrar };
}

const vacio = (texto, icono = 'inbox') => `<div class="empty">${ic(icono)}<span>${esc(texto)}</span></div>`;

// ---------- formulario de reporte de falla ----------
function formularioReporte(cont, perfil, { origen, unidades = [], onVer } = {}) {
  const fijo = perfil.rol === 'chofer';
  cont.innerHTML = `<form class="card" novalidate>
    <div class="card-h"><div><h2>Reportar una falla</h2><p>Las reglas asignan sistema, prioridad y acción</p></div><span class="badge b-auto">Automatización</span></div>
    <label class="f">Unidad<select name="unidadId" ${fijo ? 'disabled' : ''}></select>${fijo ? '<span class="hint">Su unidad asignada. Para cambiarla, consulte al administrador.</span>' : ''}</label>
    <label class="f">Descripción de la falla <span class="hint">Escríbala como la contaría por radio o WhatsApp.</span>
      <textarea name="descripcion" maxlength="400" placeholder="Ej.: la prensa pierde fuerza y se escucha un silbido en la bomba"></textarea>
      <span class="hint cnt">0 / 400</span></label>
    <div class="chips" aria-label="Ejemplos de reporte">${EJEMPLOS.map(([t, d]) => `<button type="button" class="chipx" data-t="${esc(d)}">${esc(t)}</button>`).join('')}</div>
    <label class="f">Observaciones (opcional) <span class="hint">Lugar, kilometraje u otro dato útil.</span><input name="observaciones" maxlength="400" autocomplete="off"></label>
    <div class="preview" aria-live="polite">
      <span class="badge b-auto" style="justify-self:start">Clasificación automática</span>
      <div class="pv"><span>Sistema</span><b class="pvS">—</b><span>Prioridad</span><span class="pvP">—</span><span>Acción</span><span class="pvA">Escriba la descripción para ver la clasificación.</span></div>
      <p class="foot">Reglas de palabras clave (no es IA). La fecha y la hora las registra el servidor al recibir el reporte.</p>
    </div>
    <button class="btn block" type="submit">${ic('send')}Enviar reporte</button>
  </form>
  <div class="res-rep" hidden></div>`;
  const form = $('form', cont), sel = form.unidadId, txt = form.descripcion, res = $('.res-rep', cont), btn = $('button[type=submit]', form);
  let ids = null, enviando = false;
  const pintarUnidades = lista => {
    const actual = sel.value;
    const opciones = fijo ? (perfil.unidadAsignada ? [perfil.unidadAsignada] : []) : lista.map(u => u.codigo);
    sel.innerHTML = opciones.length ? (fijo ? '' : '<option value="">Elija la unidad…</option>') + opciones.map(c => `<option>${esc(c)}</option>`).join('') : '<option value="">Sin unidad asignada</option>';
    if (opciones.includes(actual)) sel.value = actual;
    btn.disabled = fijo && !perfil.unidadAsignada;
  };
  const vista = () => {
    const t = txt.value.trim(); $('.cnt', form).textContent = `${txt.value.length} / 400`;
    if (t.length < 3) { $('.pvS', form).textContent = '—'; $('.pvP', form).textContent = '—'; $('.pvA', form).textContent = 'Escriba la descripción para ver la clasificación.'; return; }
    const c = reglas(t); $('.pvS', form).textContent = c.sistema; $('.pvP', form).innerHTML = pillPrioridad(c.prioridad); $('.pvA', form).textContent = c.accion;
  };
  txt.addEventListener('input', vista);
  form.querySelectorAll('.chipx').forEach(b => b.onclick = () => { txt.value = b.dataset.t; vista(); txt.focus(); });
  form.onsubmit = async e => {
    e.preventDefault(); if (enviando) return;
    const d = { unidadId: fijo ? perfil.unidadAsignada : sel.value, descripcion: txt.value, observaciones: form.observaciones.value };
    const errs = S.validarReporte(perfil, d);
    if (Object.keys(errs).length) { marcarErrores(form, errs); return; }
    marcarErrores(form, {});
    // Los identificadores se generan una vez y se reutilizan si hay que reintentar: así un doble toque o un reintento no duplica el reporte.
    if (!ids) ids = S.nuevosIdsReporte();
    enviando = true; ocupado(btn, true, 'Enviando…');
    try {
      const r = await S.crearReporte(perfil, d, ids, origen);
      ids = null;
      mostrarResultado(r);
    } catch (err) {
      if (err.campos) marcarErrores(form, err.campos);
      toast(mensajeError(err) + ' Puede reintentar: el reporte no se duplicará.', 'crit', 8000);
    } finally { enviando = false; ocupado(btn, false); }
  };
  function mostrarResultado(r) {
    form.hidden = true; res.hidden = false;
    const tono = r.enCola ? 'warn' : 'good';
    const texto = r.duplicadoEvitado ? `El reporte ya estaba registrado como ${esc(r.codigo)}; no se duplicó.`
      : r.enCola ? `Sin confirmación del servidor: el reporte quedó guardado en este equipo y se enviará al recuperar la señal. Código asignado: <b class="num">${esc(r.codigo)}</b>.`
      : `Reporte enviado. Se creó la orden <b class="num">${esc(r.codigo)}</b> en estado Pendiente.`;
    res.innerHTML = `<div class="card"><div class="note ${tono}">${texto}</div>
      <dl class="dl"><dt>Unidad</dt><dd>${esc(form.unidadId.value || perfil.unidadAsignada)}</dd><dt>Sistema</dt><dd>${esc(r.sistema)}</dd><dt>Prioridad</dt><dd>${pillPrioridad(r.prioridad)}</dd><dt>Acción</dt><dd>${esc(r.accion)}</dd></dl>
      <div style="display:grid;gap:8px">${onVer ? '<button type="button" class="btn dark block" data-a="ver">Ver seguimiento</button>' : ''}<button type="button" class="btn sec block" data-a="otro">Registrar otro reporte</button></div></div>`;
    res.querySelector('[data-a=otro]').onclick = () => { form.reset(); vista(); res.hidden = true; form.hidden = false; txt.focus(); };
    const v = res.querySelector('[data-a=ver]'); if (v) v.onclick = () => onVer(r.otId);
    toast(r.enCola ? `${r.codigo} guardado en el equipo; se enviará al reconectar.` : `${r.codigo} registrado.`, r.enCola ? 'warn' : 'ok');
  }
  pintarUnidades(unidades); vista();
  return { unidades: lista => pintarUnidades(lista) };
}

    dOt.innerHTML = datosOrden(o);

    tl.innerHTML = filas.length ? filas.map(s => `<li class="${esc(s.tipo)}"><div class="when">${esc(fFecha(s.en))} · <span class="who">${esc(s.autorCodigo)}</span> (${esc(rolTexto(s.autorRol))})${s._pend ? ' · <span class="pill p-cola">Pendiente de envío</span>' : ''}</div><p>${esc(s.texto)}</p></li>`).join('') : '<li><p class="muted">Sin movimientos todavía.</p></li>';

      else if (o.estado === 'atencion' && (o.mecanicoUid === yo || admin)) partes.push(`<form class="card fRes" novalidate><div class="card-h"><h3>Cerrar la orden</h3></div>
        <label class="f">Trabajos realizados<textarea name="trabajosRealizados" maxlength="600" placeholder="Ej.: cambio de sellos de la bomba y prueba de presión"></textarea></label>
        <div class="frow"><label class="f">Horas de reparación<input name="horasReparacion" type="number" inputmode="decimal" min="0.1" max="720" step="0.1"></label>

        <button class="btn ok block" type="submit">${ic('check')}Marcar como resuelta</button></form>`);
      else if (o.estado === 'atencion') partes.push(`<div class="note">La atiende ${esc(o.mecanicoCodigo)}. Solo esa persona o el administrador puede cerrarla.</div>`);
    }
    if (puede(perfil.rol, 'observarSeguimiento')) partes.push(`<form class="card fObs" novalidate><label class="f">Agregar observación al seguimiento<textarea name="texto" maxlength="400" style="min-height:80px" placeholder="Ej.: repuesto solicitado al almacén"></textarea></label><button class="btn sec block" type="submit">Agregar observación</button></form>`);
    if (perfil.rol === 'chofer') partes.push('<div class="note">Aquí ve el avance de la orden. El mecánico registra la atención y el cierre.</div>');

      const v = S.validarCierre(c); if (Object.keys(v.errores).length) { marcarErrores(fR, v.errores); return; }
      marcarErrores(fR, {}); const b = $('button[type=submit]', fR); ocupado(b, true, 'Guardando…');

    if (fO) fO.onsubmit = async e => {
      e.preventDefault(); const b = $('button[type=submit]', fO);
      const t = fO.texto.value.trim(); if (t.length < 3) { marcarErrores(fO, { texto: 'Escriba al menos 3 caracteres.' }); return; }

}

const rolTexto = r => ({ chofer: 'chofer', mecanico: 'mecánico', supervisor: 'supervisor', administrador: 'administrador' }[r] || r);

// ---------- alertas calculadas con las operaciones registradas ----------
const horasDesde = iso => (Date.now() - new Date(iso)) / 36e5;
function alertasChofer(perfil, misOrdenes, ordenesUnidad, inspUnidad) {
  const out = [], u = perfil.unidadAsignada;
  if (u) {
    const e = S.estadoUnidad(u, ordenesUnidad);
    if (e.nivel === 2) out.push({ nivel: 'crit', titulo: `${u}: no debe salir a ruta`, texto: `${e.detalle}. Espere la indicación del mecánico.`, en: null, fija: true });
    else if (e.nivel === 1) out.push({ nivel: 'warn', titulo: `${u}: en ruta con advertencia`, texto: `${e.detalle}.`, en: null, fija: true });
    const ins = inspUnidad[0];
    if (ins && ins.resultado !== 'apta') out.push({ nivel: ins.resultado === 'no_apta' ? 'crit' : 'warn', titulo: `Inspección de ${u}: ${S.RESULTADOS[ins.resultado]}`, texto: `${ins.sistema}: ${ins.observaciones} (${ins.responsableCodigo}).`, en: ins.creadoEn });
  }
  const vistas = new Map(); [...misOrdenes, ...ordenesUnidad].forEach(o => vistas.set(o.id, o));
  [...vistas.values()].sort(recientes).slice(0, 30).forEach(o => {
    const propio = o.reportadoPorUid === perfil.uid ? 'Su reporte' : 'Orden de su unidad';
    if (o.estado === 'pendiente') out.push({ nivel: 'info', titulo: `${propio} ${o.codigo}: pendiente`, texto: o.resumen, en: o.creadoEn, otId: o.id });
    else if (o.estado === 'atencion') out.push({ nivel: 'auto', titulo: `${o.codigo}: en atención por ${o.mecanicoCodigo}`, texto: o.resumen, en: o.inicioEn, otId: o.id });
    else out.push({ nivel: 'good', titulo: `${o.codigo}: resuelta`, texto: o.trabajosRealizados, en: o.resueltaEn, otId: o.id });
  });
  return out;
}
function alertasTaller(ordenes) {
  const out = [], ab = ordenes.filter(o => o.estado !== 'resuelta');
  S.UNIDADES_CATALOGO.filter(u => u.ruta).forEach(u => { const e = S.estadoUnidad(u.codigo, ordenes); if (e.nivel === 2) out.push({ nivel: 'crit', titulo: `${u.codigo} fuera de ruta (${u.ruta})`, texto: e.detalle, en: null, fija: true }); });
  ab.filter(o => o.estado === 'pendiente').sort(porPrioridad).forEach(o => {
    const h = horasDesde(o.creadoEn);
    if (o.prioridad === 'alta') out.push({ nivel: 'crit', titulo: `Prioridad alta sin atender: ${o.codigo} · ${o.unidadId}`, texto: o.resumen, en: o.creadoEn, otId: o.id });
    else if (h >= 2) out.push({ nivel: 'warn', titulo: `Sin atender hace ${Math.floor(h)} h: ${o.codigo} · ${o.unidadId}`, texto: o.resumen, en: o.creadoEn, otId: o.id });
    else out.push({ nivel: 'info', titulo: `Nueva orden ${o.codigo} · ${o.unidadId}`, texto: o.resumen, en: o.creadoEn, otId: o.id });
  });
  ab.filter(o => o.estado === 'atencion' && horasDesde(o.inicioEn) >= 24).forEach(o => out.push({ nivel: 'warn', titulo: `En atención hace más de 24 h: ${o.codigo}`, texto: `${o.unidadId} · atiende ${o.mecanicoCodigo}`, en: o.inicioEn, otId: o.id }));
  return out;
}
const TONO = { crit: 'p-crit', warn: 'p-adv', good: 'p-ok', auto: 'p-aten', info: 'p-pend' };
const NIVEL = { crit: 'Crítica', warn: 'Advertencia', good: 'Resuelta', auto: 'En atención', info: 'Aviso' };
function listaAlertas(alertas, visto) {
  if (!alertas.length) return vacio('Sin alertas. Las alertas se calculan con las órdenes e inspecciones registradas.', 'bell');
  return `<div class="list">${alertas.map(a => `<${a.otId ? `button type="button" data-ot="${esc(a.otId)}"` : 'div'} class="row" style="grid-template-columns:1fr auto${a.nivel === 'crit' ? ';border-color:#E2B4AC;background:var(--crit-soft)' : ''}">
    <span class="t">${a.en && visto && a.en > visto ? '<span class="pill p-cola">Nuevo</span> ' : ''}${esc(a.titulo)}</span><span class="r"><span class="pill ${TONO[a.nivel]}">${NIVEL[a.nivel]}</span></span>
    <span class="s" style="grid-column:1/3">${esc(a.texto || '')}${a.en ? ` · ${esc(fRel(a.en))}` : ''}</span></${a.otId ? 'button' : 'div'}>`).join('')}</div>`;
}
const contarNuevas = (alertas, visto) => alertas.filter(a => a.fija ? a.nivel === 'crit' : (a.en && (!visto || a.en > visto))).length;
return { porPrioridad, recientes, filaOrden, vacio, errorCarga, formularioReporte, detalleOrden, datosOrden, alertasChofer, alertasTaller, listaAlertas, contarNuevas, pillResultado };
})();

  enlazarSalir();
  conexion = indicadorConexion($('.conn', root), A);
  $('.bnav', root).addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) ir(b.dataset.tab); });
  $('#vista', root).addEventListener('click', e => {
    const a = e.target.closest('[data-ir]'); if (a) { ir(a.dataset.ir); return; }
    const o = e.target.closest('[data-ot]'); if (o) abrirDetalle(o.dataset.ot);
  });
  const fallo = e => { D.error = e; refrescar(); };
  const meta = m => conexion(m);
  subs.push(S.vigilarOrdenes(perfil, (rows, m) => { avisarCambios(rows); D.ordenes = rows; D.cargado = true; D.error = null; meta(m); refrescar(); }, fallo));
  subs.push(S.vigilarUnidades(rows => { D.unidades = rows; refrescar(); }, fallo));
  if (perfil.rol === 'chofer' && perfil.unidadAsignada) {
    subs.push(S.vigilarOrdenesUnidad(perfil.unidadAsignada, (rows, m) => { D.ordenesUnidad = rows; meta(m); refrescar(); }, fallo));
    subs.push(S.vigilarInspeccionesUnidad(perfil.unidadAsignada, rows => { D.insp = rows; refrescar(); }, fallo));
  }
  const ini = location.hash.slice(1);
  mostrar(tabs().some(t => t[0] === ini) ? ini : tabs()[0][0]);
}

// Aviso en pantalla cuando cambia el estado de una orden que este usuario sigue (no en la primera carga).
function avisarCambios(rows) {
  const primera = !D.cargado;
  rows.forEach(o => {
    const antes = prevEstado.get(o.id);
    if (!primera && antes !== o.estado) {
      if (perfil.rol === 'chofer' && antes && o.estado === 'atencion') toast(`${o.codigo}: en atención por ${o.mecanicoCodigo}.`, 'ok', 6000);
      else if (perfil.rol === 'chofer' && antes && o.estado === 'resuelta') toast(`${o.codigo}: resuelta.`, 'ok', 6000);
      else if (perfil.rol !== 'chofer' && !antes && o.reportadoPorUid !== perfil.uid && o.estado === 'pendiente') toast(`Nueva orden ${o.codigo} · ${o.unidadId} · prioridad ${o.prioridad}.`, o.prioridad === 'alta' ? 'crit' : '', 7000);
    }
    prevEstado.set(o.id, o.estado);
  });
}

function ir(n) { if (location.hash.slice(1) === n) mostrar(n); else location.hash = n; }
function mostrar(n) {
  if (!tabs().some(t => t[0] === n)) n = tabs()[0][0];
  vista = n; frmReporte = null;
  $$('.bnav [data-tab]', root).forEach(b => { const on = b.dataset.tab === n; b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const el = $('#vista', root); el.innerHTML = '';
  V[n].montar(el); refrescar();
  if (n === 'alertas') guardarVisto();
  window.scrollTo(0, 0); el.focus({ preventScroll: true });
}
function refrescar() {
  if (!perfil || !vista) return;
  const el = $('#vista', root); if (!el) return;
  if (D.error) { const box = $('[data-error]', el); if (box) box.innerHTML = errorCarga(D.error); }
  V[vista].actualizar(el);
  const al = perfil.rol === 'chofer' ? alertasChofer(perfil, D.ordenes, D.ordenesUnidad, D.insp) : alertasTaller(D.ordenes);
  const n = vista === 'alertas' ? al.filter(a => a.fija && a.nivel === 'crit').length : contarNuevas(al, leerVisto());
  const b = $('.bnav [data-tab=alertas]', root);
  if (b) { let c = $('.cnt', b); if (n) { if (!c) { c = document.createElement('span'); c.className = 'cnt'; b.append(c); } c.textContent = n; b.setAttribute('aria-label', `Alertas (${n})`); } else { if (c) c.remove(); b.removeAttribute('aria-label'); } }
}

function abrirDetalle(id) {
  if (detalle) { const d = detalle; detalle = null; d.cerrar(); }
  let dejar = null;
  const h = hoja('Orden de trabajo', '', { onClose: () => { if (dejar) dejar(); if (detalle === h) detalle = null; if (history.state && history.state.flotaiaHoja) history.back(); } });
  dejar = detalleOrden(h.el, perfil, id);
  history.pushState({ flotaiaHoja: 1 }, '');
  detalle = h;
}

// ---------- vistas ----------
const unidadDe = c => D.unidades.find(u => u.codigo === c);
const semaforo = (u, e) => { const r = unidadDe(u); return `<div class="semaforo n${e.nivel}" role="status"><span class="luz" aria-hidden="true"></span><div><span class="small muted">Unidad <b class="num" style="display:inline;font-size:1rem">${esc(u)}</b>${r && r.ruta ? ` · ruta ${esc(r.ruta)}` : ''}</span><b>${e.nivel === 2 ? 'No sale a ruta' : esc(e.texto)}</b><span class="small">${esc(e.detalle)}</span></div></div>`; };
const sinUnidad = '<div class="note warn">Aún no tiene una unidad asignada. Pida al administrador que se la asigne para poder reportar.</div>';
const cargando = () => D.cargado ? '' : '<p class="muted">Cargando…</p>';
const seg = (nombre, opciones, actual) => `<div class="seg" role="group" aria-label="${esc(nombre)}">${opciones.map(([v, t]) => `<button type="button" data-f="${v}" class="${v === actual ? 'on' : ''}" aria-pressed="${v === actual}">${t}</button>`).join('')}</div>`;
function enlazarSeg(el, alCambiar) { $$('.seg [data-f]', el).forEach(b => b.onclick = () => { $$('.seg [data-f]', el).forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); }); alCambiar(b.dataset.f); }); }
const filtros = { reportes: 'todos', ordenes: 'disponibles', unidad: '' };

const V = {
  inicio: {
    montar(el) {
      el.innerHTML = `<div class="vhead saludo"><div class="eyebrow">Chofer · ${esc(perfil.codigo)}</div><h1>Hola, ${esc(perfil.nombre)}</h1></div>
        <div data-error></div><div data-sem></div>
        <button type="button" class="btn accion-grande" data-ir="reportar">${ic('plus')}Reportar una falla</button>
        <section class="card"><div class="card-h"><div><h2>Mis reportes</h2><p>Operaciones registradas</p></div><button type="button" class="btn sec sm" data-ir="reportes">Ver todos</button></div>
          <div class="mini3" data-cnt></div><div class="list" data-ult></div></section>`;
    },
    actualizar(el) {
      const u = perfil.unidadAsignada;
      $('[data-sem]', el).innerHTML = u ? semaforo(u, S.estadoUnidad(u, D.ordenesUnidad)) : sinUnidad;
      const c = e => D.ordenes.filter(o => o.estado === e).length;
      $('[data-cnt]', el).innerHTML = `<div class="kpi warn"><span class="l">Pendientes</span><span class="v">${c('pendiente')}</span></div><div class="kpi auto"><span class="l">En atención</span><span class="v">${c('atencion')}</span></div><div class="kpi good"><span class="l">Resueltas</span><span class="v">${c('resuelta')}</span></div>`;
      const ult = [...D.ordenes].sort(recientes).slice(0, 3);
      $('[data-ult]', el).innerHTML = cargando() || (ult.length ? ult.map(o => filaOrden(o, { mostrarUnidad: false })).join('') : vacio('Todavía no ha enviado reportes.'));
    },
  },
  unidad: {
    montar(el) {
      const u = perfil.unidadAsignada;
      el.innerHTML = `<div class="vhead"><div class="eyebrow">Mi unidad</div><h1 class="num">${esc(u || 'Sin unidad asignada')}</h1><p class="lead">El estado se calcula con las órdenes abiertas y las inspecciones registradas de la unidad.</p></div>
        <div data-error></div><div data-sem></div>
        <section class="card"><div class="card-h"><h2>Órdenes abiertas de la unidad</h2></div><div class="list" data-ab></div></section>
        <section class="card"><div class="card-h"><div><h2>Últimas inspecciones</h2><p>Registradas por el taller o la supervisión</p></div></div><div class="list" data-ins></div></section>
        <section class="card"><dl class="dl" data-ficha></dl><p class="foot">Unidad y ruta del caso simulado de El Tambo.</p></section>`;
    },
    actualizar(el) {
      const u = perfil.unidadAsignada;
      if (!u) { $('[data-sem]', el).innerHTML = sinUnidad; $('[data-ab]', el).innerHTML = vacio('Sin unidad asignada.'); $('[data-ins]', el).innerHTML = ''; $('[data-ficha]', el).innerHTML = ''; return; }
      $('[data-sem]', el).innerHTML = semaforo(u, S.estadoUnidad(u, D.ordenesUnidad));
      const ab = D.ordenesUnidad.filter(o => o.estado !== 'resuelta').sort(porPrioridad);
      $('[data-ab]', el).innerHTML = ab.length ? ab.map(o => filaOrden(o, { mostrarUnidad: false })).join('') : vacio('Sin órdenes abiertas.', 'check');
      $('[data-ins]', el).innerHTML = D.insp.length ? D.insp.slice(0, 5).map(i => `<div class="row" style="cursor:default;grid-template-columns:1fr auto"><span class="t">${esc(i.sistema)} · ${esc(S.CONDICIONES[i.condicion])}</span><span class="r">${pillResultado(i.resultado)}</span><span class="s" style="grid-column:1/3">${esc(fFecha(i.creadoEn))} · ${esc(i.responsableCodigo)}${i.observaciones ? ' · ' + esc(i.observaciones) : ''}</span></div>`).join('') : vacio('Sin inspecciones registradas.');
      const r = unidadDe(u);
      $('[data-ficha]', el).innerHTML = r ? `<dt>Código</dt><dd class="num">${esc(r.codigo)}</dd><dt>Tipo</dt><dd>${esc(r.tipo === 'compactadora' ? 'Compactadora' : 'Camión baranda')}</dd><dt>Ruta</dt><dd>${esc(r.ruta || 'Sin ruta fija')}</dd>` : '<dt>Unidad</dt><dd>Catálogo de unidades no inicializado.</dd>';
    },
  },
  reportar: {
    montar(el) {
      el.innerHTML = '<div data-error></div><div data-frm style="display:grid;gap:14px"></div>';
      frmReporte = formularioReporte($('[data-frm]', el), perfil, { origen: 'mobile', unidades: D.unidades, onVer: id => abrirDetalle(id) });
    },
    actualizar() { if (frmReporte && perfil.rol !== 'chofer' && document.activeElement?.name !== 'unidadId') frmReporte.unidades(D.unidades); },
  },
  reportes: {
    montar(el) {
      el.innerHTML = `<div class="vhead"><div class="eyebrow">Seguimiento</div><h1>Mis reportes</h1><p class="lead">Toque un reporte para ver su avance en tiempo real.</p></div><div data-error></div>
        ${seg('Filtrar reportes', [['todos', 'Todos'], ['abiertos', 'Abiertos'], ['resueltos', 'Resueltos']], filtros.reportes)}<div class="list" data-l></div>`;
      enlazarSeg(el, v => { filtros.reportes = v; refrescar(); });
    },
    actualizar(el) {
      const f = filtros.reportes, L = D.ordenes.filter(o => f === 'todos' || (f === 'abiertos' ? o.estado !== 'resuelta' : o.estado === 'resuelta')).sort(recientes);
      $('[data-l]', el).innerHTML = cargando() || (L.length ? L.map(o => filaOrden(o)).join('') : vacio(f === 'todos' ? 'Todavía no ha enviado reportes.' : 'No hay reportes en este grupo.'));
    },
  },
  ordenes: {
    montar(el) {
      el.innerHTML = `<div class="vhead"><div class="eyebrow">${esc(ROL_NOMBRE[perfil.rol])} · ${esc(perfil.codigo)}</div><h1>Órdenes de trabajo</h1><p class="lead">Ordenadas por prioridad. Toque una orden para atenderla.</p></div><div data-error></div>
        <div class="filtros"><div data-seg></div><label class="f">Unidad<select data-u></select></label></div><div class="list" data-l></div>`;
      $('[data-u]', el).onchange = e => { filtros.unidad = e.target.value; refrescar(); };
    },
    actualizar(el) {
      const yo = perfil.uid, ab = D.ordenes.filter(o => o.estado !== 'resuelta');
      const grupos = { disponibles: ab.filter(o => o.estado === 'pendiente'), mias: ab.filter(o => o.estado === 'atencion' && o.mecanicoUid === yo), abiertas: ab };
      $('[data-seg]', el).innerHTML = seg('Grupo de órdenes', [['disponibles', `Pendientes (${grupos.disponibles.length})`], ['mias', `Mías (${grupos.mias.length})`], ['abiertas', `Abiertas (${ab.length})`]], filtros.ordenes);
      enlazarSeg(el, v => { filtros.ordenes = v; refrescar(); });
      pintarSelectUnidad($('[data-u]', el));
      const L = grupos[filtros.ordenes].filter(o => !filtros.unidad || o.unidadId === filtros.unidad).sort(porPrioridad);
      $('[data-l]', el).innerHTML = cargando() || (L.length ? L.map(o => filaOrden(o)).join('') : vacio({ disponibles: 'No hay órdenes pendientes.', mias: 'No tiene órdenes en atención.', abiertas: 'No hay órdenes abiertas.' }[filtros.ordenes], 'check'));
    },
  },
  historial: {
    montar(el) {
      el.innerHTML = `<div class="vhead"><div class="eyebrow">Taller</div><h1>Historial</h1><p class="lead">Órdenes resueltas, de la más reciente a la más antigua.</p></div><div data-error></div>
        <label class="f">Unidad<select data-u></select></label><div class="mini3" data-k></div><div class="list" data-l></div>`;
      $('[data-u]', el).onchange = e => { filtros.unidad = e.target.value; refrescar(); };
    },
    actualizar(el) {
      pintarSelectUnidad($('[data-u]', el));
      const R = D.ordenes.filter(o => o.estado === 'resuelta' && (!filtros.unidad || o.unidadId === filtros.unidad)).sort((a, b) => String(b.resueltaEn).localeCompare(String(a.resueltaEn)));
      const mias = R.filter(o => o.mecanicoUid === perfil.uid).length, mttr = R.length ? R.reduce((s, o) => s + (Number(o.horasReparacion) || 0), 0) / R.length : null;
      $('[data-k]', el).innerHTML = `<div class="kpi good"><span class="l">Resueltas</span><span class="v">${R.length}</span></div><div class="kpi auto"><span class="l">Por usted</span><span class="v">${mias}</span></div><div class="kpi"><span class="l">Reparación media</span><span class="v" style="font-size:1.3rem">${esc(fHoras(mttr))}</span></div>`;
      $('[data-l]', el).innerHTML = cargando() || (R.length ? R.map(o => filaOrden(o)).join('') : vacio('Todavía no hay órdenes resueltas.'));
    },
  },
  alertas: {
    montar(el) {
      el.innerHTML = `<div class="vhead"><div class="eyebrow">Avisos</div><h1>Alertas</h1><p class="lead">${perfil.rol === 'chofer' ? 'Estado de su unidad y avance de sus reportes.' : 'Órdenes que requieren atención y unidades fuera de ruta.'} Se calculan con las operaciones registradas.</p></div><div data-error></div><div data-l></div>`;
      el.dataset.visto = leerVisto();
    },
    actualizar(el) {
      const al = perfil.rol === 'chofer' ? alertasChofer(perfil, D.ordenes, D.ordenesUnidad, D.insp) : alertasTaller(D.ordenes);
      $('[data-l]', el).innerHTML = cargando() || listaAlertas(al, el.dataset.visto);
    },
  },
};
function pintarSelectUnidad(sel) {
  if (document.activeElement === sel) return;
  const ops = D.unidades.map(u => u.codigo);
  sel.innerHTML = '<option value="">Todas</option>' + ops.map(c => `<option${c === filtros.unidad ? ' selected' : ''}>${esc(c)}</option>`).join('');
}

arrancar();
return {  };
})();

// Manifiesto opcional: solo se enlaza si está publicado junto a esta página.
fetch('manifest.webmanifest', { method: 'HEAD', cache: 'no-store' }).then(r => { if (r.ok) { const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.append(l); } }).catch(() => {});
// En el modo local de prueba se exponen los módulos para las pruebas automáticas (no se hace con Firebase).
if (new URLSearchParams(location.search).get('modo') === 'local') window.__FLOTAIA_MODULOS__ = __M;
</script>
