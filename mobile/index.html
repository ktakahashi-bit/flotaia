/* ===== shared/common.css ===== */
/* FlotaIA · estilos compartidos por Mobile y Tablet.
   Mismo sistema visual que el escritorio V13 «Cinta reflectiva»: asfalto, concreto y amarillo de señalización. */
:root{
  color-scheme:light;
  --asfalto:#1F2A2E; --asfalto-2:#2A373C; --asfalto-3:#3A4A50;
  --concreto:#EDEFEB; --concreto-2:#E3E6E1; --blanco:#FFFFFF;
  --senal:#F2B300; --senal-hover:#DFA400; --senal-soft:#FFF4CF;
  --petroleo:#2B5D6E; --petroleo-soft:#E3EEF1;
  --surface:#FFFFFF; --surface-2:#F6F7F4;
  --ink:#1B2427; --ink-2:#34434A; --muted:#5C6A6F; --faint:#88959A;
  --line:#D6DAD4; --line-2:#C2C8C1;
  --good:#2F7A4E; --good-soft:#E3F1E8; --warn:#A86E0B; --warn-soft:#FBF0D9; --crit:#B83A2A; --crit-soft:#F8E4E0;
  --ia:#5B4BB7; --ia-soft:#ECE9F8; --auto:#2B5D6E; --auto-soft:#E3EEF1; --sim:#7A5A12; --sim-soft:#F5EDD8;
  --sans:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Semi Condensed","Barlow","Arial Narrow",sans-serif;
  --code:"IBM Plex Mono",Consolas,monospace;
  --chevron:repeating-linear-gradient(-45deg,var(--senal) 0 12px,var(--asfalto) 12px 24px);
  --r-sm:4px; --r:6px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--concreto);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--cond);color:var(--ink);margin:0;line-height:1.15}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--petroleo)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
::selection{background:var(--senal-soft)}
:where(a,button,select,input,textarea,[tabindex]):focus-visible{outline:2px solid var(--asfalto);outline-offset:2px;box-shadow:0 0 0 5px var(--senal)}

/* ---------- franja de MODO LOCAL: nunca se confunde con Firebase ---------- */
.modo-local{position:sticky;top:0;z-index:90;background:var(--crit);color:#fff;font-family:var(--cond);font-weight:700;font-size:.9rem;line-height:1.25;
  padding:calc(5px + var(--safe-t)) calc(12px + var(--safe-r)) 5px calc(12px + var(--safe-l));display:flex;gap:2px 10px;flex-wrap:wrap;align-items:center;justify-content:center;text-align:center}
.modo-local span{font-family:var(--sans);font-weight:500;font-size:.74rem;opacity:.95}
.modo-local button{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:var(--r-sm);font-size:.74rem;padding:1px 8px;cursor:pointer;font-family:var(--sans)}
@media (max-width:640px){.modo-local span{order:3;flex-basis:100%}}

/* ---------- barra superior con borde de cinta reflectiva ---------- */
.topbar{background:var(--asfalto);color:#fff;position:relative;padding:10px calc(16px + var(--safe-r)) 18px calc(16px + var(--safe-l));display:flex;align-items:center;gap:12px}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--chevron)}
.has-safe-top .topbar{padding-top:calc(10px + var(--safe-t))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.bname{font-family:var(--cond);font-size:1.35rem;font-weight:700;color:#fff;line-height:1}
.bname span{color:var(--senal)}
.bsub{font-size:.72rem;color:#A4B0AD;line-height:1.2;margin-top:2px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.chip-rol{font-family:var(--cond);font-size:.88rem;font-weight:600;background:var(--asfalto-3);color:#fff;border-radius:3px;padding:3px 8px;white-space:nowrap}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:var(--r-sm);border:1px solid #4B5B61;background:transparent;color:#E6EBE9;cursor:pointer}
.iconbtn:hover{background:var(--asfalto-2)}

/* indicador de conexión: solo describe lo que informa el SDK */
.conn{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:#D3DAD8;white-space:nowrap}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint)}
.conn.ok::before{background:#5FC28A}
.conn.cache::before{background:var(--senal)}
.conn.off::before{background:#F2A597}
.conn.local::before{background:#F2A597}

.proto-band{background:var(--sim-soft);color:var(--sim);font-size:.8rem;font-weight:600;padding:6px calc(16px + var(--safe-r)) 6px calc(16px + var(--safe-l));display:flex;flex-wrap:wrap;gap:2px 10px}
.proto-band b{font-family:var(--cond);font-weight:700}

/* ---------- superficies ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 12px;flex-wrap:wrap}
.card-h p{color:var(--muted);font-size:.86rem;margin-top:2px}
.eyebrow{font-size:.82rem;font-weight:600;color:var(--petroleo)}
.vhead{display:grid;gap:4px;margin-bottom:4px}
.vhead .lead{color:var(--ink-2);font-size:.95rem;max-width:70ch}
.foot{font-size:.8rem;color:var(--muted)}
.note{background:var(--surface-2);border-left:4px solid var(--petroleo);padding:10px 12px;font-size:.88rem;color:var(--ink-2)}
.note.crit{border-left-color:var(--crit);background:var(--crit-soft)}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.good{border-left-color:var(--good);background:var(--good-soft)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 16px;position:relative;display:grid;gap:2px;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:var(--r) 0 0 var(--r);background:var(--kc,var(--line-2))}
.kpi .l{font-size:.82rem;color:var(--muted)}
.kpi .v{font-family:var(--cond);font-size:1.9rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .m{font-size:.78rem;color:var(--muted)}
.kpi.crit{--kc:var(--crit)}.kpi.warn{--kc:var(--senal)}.kpi.good{--kc:var(--good)}.kpi.auto{--kc:var(--petroleo)}

/* ---------- botones y controles (objetivo táctil ≥ 44 px) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:var(--r-sm);
  background:var(--senal);border:1px solid var(--senal);color:var(--asfalto);font-family:var(--cond);font-size:1.05rem;font-weight:600;cursor:pointer;text-decoration:none;touch-action:manipulation}
.btn:hover{background:var(--senal-hover);border-color:var(--senal-hover)}
.btn.sec{background:var(--surface);border-color:var(--line-2);color:var(--asfalto)}
.btn.sec:hover{background:var(--surface-2);border-color:var(--asfalto)}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.btn.dark{background:var(--asfalto);border-color:var(--asfalto);color:#fff}
.btn.danger{background:var(--surface);color:var(--crit);border-color:#E2B4AC}
.btn.sm{min-height:38px;font-size:.95rem;padding:6px 12px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn .spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.f{display:grid;gap:5px;font-size:.9rem;font-weight:600;color:var(--ink-2);min-width:0}
.f .hint{font-weight:400;color:var(--muted);font-size:.8rem}
input,select,textarea{width:100%;min-height:46px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;padding:10px 12px;font-size:16px;font-weight:400;color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.45}
input:disabled,select:disabled{background:var(--surface-2);color:var(--muted)}
.f.has-err input,.f.has-err select,.f.has-err textarea{border-color:var(--crit);background:#FFFBFA}
.ferr{color:var(--crit);font-size:.82rem;font-weight:600;min-height:0}
.ferr:empty{display:none}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipx{border:1px dashed var(--line-2);background:var(--surface-2);border-radius:var(--r-sm);padding:8px 10px;font-size:.88rem;cursor:pointer;min-height:40px}
.chipx:hover{border-color:var(--asfalto)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;padding:2px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:3px;padding:8px 12px;font-family:var(--cond);font-size:.98rem;cursor:pointer;white-space:nowrap;min-height:40px}
.seg button.on{background:var(--asfalto);color:#fff}
.radios{display:grid;gap:8px}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;background:#fff;font-weight:500}
.radio input{width:20px;height:20px;min-height:0;margin:2px 0 0;accent-color:var(--asfalto)}
.radio:has(input:checked){border-color:var(--asfalto);background:var(--senal-soft)}
.check{display:flex;gap:10px;align-items:center;font-weight:500}
.check input{width:20px;height:20px;min-height:0;accent-color:var(--asfalto)}

/* ---------- etiquetas: mismas clases que el escritorio ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:3px 8px;border-radius:3px;white-space:nowrap;line-height:1.3}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.b-ia{background:var(--ia-soft);color:var(--ia)}.b-auto{background:var(--auto-soft);color:var(--auto)}.b-sim{background:var(--sim-soft);color:var(--sim)}
.b-reg{background:var(--good-soft);color:var(--good)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:3px;white-space:nowrap}
.p-crit{background:var(--crit-soft);color:var(--crit)}.p-adv{background:var(--warn-soft);color:var(--warn)}.p-ok{background:var(--good-soft);color:var(--good)}
.p-pend{background:#fff4e5;color:#9a5b00}.p-aten{background:var(--auto-soft);color:var(--auto)}.p-res{background:#eef1f4;color:#4c5a6c}
.p-cola{background:var(--senal-soft);color:#7A5A12;border:1px dashed #C99A1A}

/* ---------- listas de órdenes ---------- */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%;cursor:pointer;position:relative}
.row:hover{border-color:var(--line-2)}
.row.sel{border-color:var(--asfalto);box-shadow:inset 4px 0 0 var(--senal)}
.row .u{font-family:var(--cond);font-size:1.25rem;font-weight:700;line-height:1.1}
.row .t{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.row .s{grid-column:2/4;font-size:.84rem;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap}
.row .r{display:grid;gap:4px;justify-items:end}
.prio-alta{box-shadow:inset 4px 0 0 var(--crit)}.prio-media{box-shadow:inset 4px 0 0 var(--senal)}.prio-baja{box-shadow:inset 4px 0 0 var(--line-2)}
.empty{display:grid;justify-items:center;gap:8px;text-align:center;color:var(--muted);padding:28px 16px;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--surface-2)}
.empty svg.i{width:28px;height:28px;color:var(--faint)}

/* datos clave/valor */
.dl{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 14px;font-size:.92rem}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
@media (max-width:520px){.dl{grid-template-columns:1fr;gap:0}.dl dt{font-size:.8rem}.dl dd{margin-bottom:8px}}

/* línea de tiempo del seguimiento */
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:6px}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--asfalto-3)}
.tl li.creacion::before{border-color:var(--senal);background:var(--senal-soft)}
.tl li.inicio::before{border-color:var(--auto);background:var(--auto-soft)}
.tl li.resolucion::before{border-color:var(--good);background:var(--good)}
.tl .when{font-size:.8rem;color:var(--muted)}
.tl .who{font-family:var(--cond);font-weight:600}
.tl p{font-size:.92rem;overflow-wrap:anywhere}

/* vista previa de la clasificación por reglas */
.preview{border:1px solid var(--line);border-left:4px solid var(--petroleo);border-radius:var(--r-sm);background:var(--surface-2);padding:12px;display:grid;gap:8px}
.pv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.pv>span:nth-child(odd){color:var(--muted)}

/* estado de unidad */
.semaforo{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.semaforo .luz{width:18px;height:18px;border-radius:50%;flex:none}
.semaforo.n0 .luz{background:var(--good)}.semaforo.n1 .luz{background:var(--senal)}.semaforo.n2 .luz{background:var(--crit)}
.semaforo.n2{background:var(--crit-soft);border-color:#E2B4AC}
.semaforo b{font-family:var(--cond);font-size:1.25rem;display:block;line-height:1.1}

.toast{background:var(--asfalto);color:#fff;border-radius:var(--r-sm);padding:12px 14px;font-size:.92rem;box-shadow:0 12px 30px rgba(31,42,46,.3);pointer-events:auto;display:flex;gap:10px;align-items:flex-start}

.toast button{margin-left:auto;background:transparent;border:0;color:#fff;cursor:pointer;font-size:1.1rem;line-height:1}
.sheet-bg{position:fixed;inset:0;padding-top:var(--local-h,0px);background:rgba(31,42,46,.5);z-index:70;display:grid;align-items:end;justify-items:center}
.sheet{background:var(--concreto);width:min(100%,640px);max-height:calc(94dvh - var(--local-h,0px));overflow:auto;border-radius:var(--r) var(--r) 0 0;padding:16px calc(16px + var(--safe-r)) calc(16px + var(--safe-b)) calc(16px + var(--safe-l));display:grid;gap:12px;align-content:start;overscroll-behavior:contain}
.sheet-h{display:flex;align-items:center;gap:10px;position:sticky;top:-16px;background:var(--concreto);padding:4px 0 8px;z-index:1}
.sheet-h h2{flex:1;min-width:0}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:var(--r);max-height:86dvh}}

.login{min-height:100dvh;display:grid;align-content:center;justify-items:center;padding:24px calc(16px + var(--safe-r)) calc(24px + var(--safe-b)) calc(16px + var(--safe-l));gap:16px}
.login .panel{width:min(100%,420px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.login .panel-h{background:var(--asfalto);color:#fff;padding:20px 20px 28px;position:relative}
.login .panel-h::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:var(--chevron)}
.login .panel-h .eyebrow{color:var(--senal);margin-top:12px}
.login .panel-h h1{color:#fff;font-size:1.5rem}
.login form{padding:18px 20px 20px;display:grid;gap:14px}
.login .msg{font-size:.9rem;font-weight:600;color:var(--crit)}
.login .msg:empty{display:none}
.login .demo{display:grid;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.login .demo-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.login .demo-btns .btn{flex-direction:column;gap:0;line-height:1.2;min-height:54px}
.estado-sesion{width:min(100%,460px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
