/* ===== shared/common.css ===== */
/* FlotaIA · estilos compartidos por Mobile y Tablet.
   Mismo sistema visual que el escritorio V13 «Cinta reflectiva»: asfalto, concreto y amarillo de señalización. */
:root{
  color-scheme:light;
  --asfalto:#1F2A2E; --asfalto-2:#2A373C; --asfalto-3:#3A4A50;
  --concreto:#EDEFEB; --concreto-2:#E3E6E1; --blanco:#FFFFFF;
  --senal:#F2B300; --senal-hover:#DFA400; --senal-soft:#FFF4CF;
  --petroleo:#2B5D6E; --petroleo-soft:#E3EEF1;
  --surface:#FFFFFF; --surface-2:#F6F7F4;
  --ink:#1B2427; --ink-2:#34434A; --muted:#5C6A6F; --faint:#88959A;
  --line:#D6DAD4; --line-2:#C2C8C1;
  --good:#2F7A4E; --good-soft:#E3F1E8; --warn:#A86E0B; --warn-soft:#FBF0D9; --crit:#B83A2A; --crit-soft:#F8E4E0;
  --ia:#5B4BB7; --ia-soft:#ECE9F8; --auto:#2B5D6E; --auto-soft:#E3EEF1; --sim:#7A5A12; --sim-soft:#F5EDD8;
  --sans:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Semi Condensed","Barlow","Arial Narrow",sans-serif;
  --code:"IBM Plex Mono",Consolas,monospace;
  --chevron:repeating-linear-gradient(-45deg,var(--senal) 0 12px,var(--asfalto) 12px 24px);
  --r-sm:4px; --r:6px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--concreto);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--cond);color:var(--ink);margin:0;line-height:1.15}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--petroleo)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
::selection{background:var(--senal-soft)}
:where(a,button,select,input,textarea,[tabindex]):focus-visible{outline:2px solid var(--asfalto);outline-offset:2px;box-shadow:0 0 0 5px var(--senal)}

/* ---------- franja de MODO LOCAL: nunca se confunde con Firebase ---------- */
.modo-local{position:sticky;top:0;z-index:90;background:var(--crit);color:#fff;font-family:var(--cond);font-weight:700;font-size:.9rem;line-height:1.25;
  padding:calc(5px + var(--safe-t)) calc(12px + var(--safe-r)) 5px calc(12px + var(--safe-l));display:flex;gap:2px 10px;flex-wrap:wrap;align-items:center;justify-content:center;text-align:center}
.modo-local span{font-family:var(--sans);font-weight:500;font-size:.74rem;opacity:.95}
.modo-local button{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:var(--r-sm);font-size:.74rem;padding:1px 8px;cursor:pointer;font-family:var(--sans)}
@media (max-width:640px){.modo-local span{order:3;flex-basis:100%}}

/* ---------- barra superior con borde de cinta reflectiva ---------- */
.topbar{background:var(--asfalto);color:#fff;position:relative;padding:10px calc(16px + var(--safe-r)) 18px calc(16px + var(--safe-l));display:flex;align-items:center;gap:12px}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--chevron)}
.has-safe-top .topbar{padding-top:calc(10px + var(--safe-t))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.bname{font-family:var(--cond);font-size:1.35rem;font-weight:700;color:#fff;line-height:1}
.bname span{color:var(--senal)}
.bsub{font-size:.72rem;color:#A4B0AD;line-height:1.2;margin-top:2px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.chip-rol{font-family:var(--cond);font-size:.88rem;font-weight:600;background:var(--asfalto-3);color:#fff;border-radius:3px;padding:3px 8px;white-space:nowrap}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:var(--r-sm);border:1px solid #4B5B61;background:transparent;color:#E6EBE9;cursor:pointer}
.iconbtn:hover{background:var(--asfalto-2)}

/* indicador de conexión: solo describe lo que informa el SDK */
.conn{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:#D3DAD8;white-space:nowrap}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint)}
.conn.ok::before{background:#5FC28A}
.conn.cache::before{background:var(--senal)}
.conn.off::before{background:#F2A597}
.conn.local::before{background:#F2A597}

.proto-band{background:var(--sim-soft);color:var(--sim);font-size:.8rem;font-weight:600;padding:6px calc(16px + var(--safe-r)) 6px calc(16px + var(--safe-l));display:flex;flex-wrap:wrap;gap:2px 10px}
.proto-band b{font-family:var(--cond);font-weight:700}

/* ---------- superficies ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 12px;flex-wrap:wrap}
.card-h p{color:var(--muted);font-size:.86rem;margin-top:2px}
.eyebrow{font-size:.82rem;font-weight:600;color:var(--petroleo)}
.vhead{display:grid;gap:4px;margin-bottom:4px}
.vhead .lead{color:var(--ink-2);font-size:.95rem;max-width:70ch}
.foot{font-size:.8rem;color:var(--muted)}
.note{background:var(--surface-2);border-left:4px solid var(--petroleo);padding:10px 12px;font-size:.88rem;color:var(--ink-2)}
.note.crit{border-left-color:var(--crit);background:var(--crit-soft)}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.good{border-left-color:var(--good);background:var(--good-soft)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 16px;position:relative;display:grid;gap:2px;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:var(--r) 0 0 var(--r);background:var(--kc,var(--line-2))}
.kpi .l{font-size:.82rem;color:var(--muted)}
.kpi .v{font-family:var(--cond);font-size:1.9rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .m{font-size:.78rem;color:var(--muted)}
.kpi.crit{--kc:var(--crit)}.kpi.warn{--kc:var(--senal)}.kpi.good{--kc:var(--good)}.kpi.auto{--kc:var(--petroleo)}

/* ---------- botones y controles (objetivo táctil ≥ 44 px) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:var(--r-sm);
  background:var(--senal);border:1px solid var(--senal);color:var(--asfalto);font-family:var(--cond);font-size:1.05rem;font-weight:600;cursor:pointer;text-decoration:none;touch-action:manipulation}
.btn:hover{background:var(--senal-hover);border-color:var(--senal-hover)}
.btn.sec{background:var(--surface);border-color:var(--line-2);color:var(--asfalto)}
.btn.sec:hover{background:var(--surface-2);border-color:var(--asfalto)}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.btn.dark{background:var(--asfalto);border-color:var(--asfalto);color:#fff}
.btn.danger{background:var(--surface);color:var(--crit);border-color:#E2B4AC}
.btn.sm{min-height:38px;font-size:.95rem;padding:6px 12px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn .spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.f{display:grid;gap:5px;font-size:.9rem;font-weight:600;color:var(--ink-2);min-width:0}
.f .hint{font-weight:400;color:var(--muted);font-size:.8rem}
input,select,textarea{width:100%;min-height:46px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;padding:10px 12px;font-size:16px;font-weight:400;color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.45}
input:disabled,select:disabled{background:var(--surface-2);color:var(--muted)}
.f.has-err input,.f.has-err select,.f.has-err textarea{border-color:var(--crit);background:#FFFBFA}
.ferr{color:var(--crit);font-size:.82rem;font-weight:600;min-height:0}
.ferr:empty{display:none}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

<script>
// flotaia/shared/checklist-catalogo.js
// Fuente única del checklist de entrega-recepción (escritorio, móvil y tablet).
// Script clásico: se incluye antes del panel del escritorio y del módulo compartido.
(function () {
  "use strict";
  // c: "alta" = punto crítico (no sale a ruta; orden de prioridad alta)
  //    "media" / "baja" = hallazgo no crítico (orden programada con esa prioridad; la unidad sale)
  //    "epp" = equipo de protección personal (la unidad no sale hasta registrar una nueva acta con EPP completo)
  // Gravedades y prioridades tomadas del formulario del escritorio (V13.1); no se agregan reglas nuevas.
  var ITEMS = [
    { id: "frenos", g: "Seguridad de la unidad", t: "Frenos de servicio y de estacionamiento", corto: "Frenos", c: "alta", s: "Chasis" },
    { id: "direccion", t: "Dirección sin juego anormal", corto: "Dirección", c: "alta", s: "Chasis" },
    { id: "llantas", t: "Llantas sin cortes, con presión y labrado adecuados", corto: "Llantas", c: "alta", s: "Chasis" },
    { id: "luces", t: "Luces, espejos y alarma de retroceso", corto: "Luces y alarma", c: "alta", s: "Eléctrico" },
    { id: "fugas", t: "Sin fugas de aceite, combustible ni refrigerante", corto: "Sin fugas", c: "alta", s: "Motor" },
    { id: "hidraulico", g: "Caja compactadora", t: "Mangueras, cilindros y nivel de aceite hidráulico", corto: "Mangueras y cilindros", c: "alta", s: "Hidráulico", soloCompactadora: true },
    { id: "prensa", t: "Prensa: ciclo en vacío y parada de emergencia", corto: "Prensa y parada de emergencia", c: "alta", s: "Hidráulico", soloCompactadora: true },
    { id: "estribos", t: "Estribos y asideros del personal firmes", corto: "Estribos", c: "alta", s: "Chasis", soloCompactadora: true },
    { id: "lixiviados", t: "Compuerta y sellos sin fuga de lixiviados", corto: "Sellos sin lixiviados", c: "media", s: "Hidráulico", soloCompactadora: true },
    { id: "documentos", g: "Documentos y equipos de emergencia", t: "SOAT, tarjeta de propiedad y revisión técnica a bordo", corto: "Documentos a bordo", c: "alta", s: "Documentos" },
    { id: "extintor", t: "Extintor cargado y vigente", corto: "Extintor", c: "alta", s: "Seguridad" },
    { id: "botiquin", t: "Botiquín, conos o triángulos y herramientas", corto: "Botiquín y herramientas", c: "baja", s: "Seguridad" },
    { id: "epp", g: "Personal", t: "EPP del chofer y los ayudantes: guantes, chaleco reflectivo, calzado y mascarilla", corto: "EPP completo", c: "epp" }
  ];
  var RESULTADOS = {
    apta: { texto: "Apta", largo: "Apta: la unidad puede salir a ruta.", pill: "p-ok", sev: 0 },
    observada: { texto: "Apta con observación", largo: "Apta con observación: se programó una orden para el taller.", pill: "p-adv", sev: 1 },
    condicionada: { texto: "Sale tras reponer EPP", largo: "Condicionada: reponga el EPP y registre una nueva revisión antes de salir.", pill: "p-adv", sev: 1 },
    no_apta: { texto: "No apta: no sale a ruta", largo: "No apta: la unidad no sale a ruta.", pill: "p-crit", sev: 2 }
  };
  // Tipo de unidad: B-01 es el camión baranda del catálogo; C-01 a C-07 son compactadoras.
  function tipoUnidad(u) { return /^B-/.test(String(u || "")) ? "baranda" : "compactadora"; }
  // Puntos que corresponden a la unidad. Los del grupo «Caja compactadora» (hidráulico, prensa, estribos, lixiviados)
  // no aplican al camión baranda: se guardan como null (no aplica), nunca como conforme.
  function aplica(it, u) { return !(it.soloCompactadora && tipoUnidad(u) === "baranda"); }
  function aplicables(u) { return ITEMS.filter(function (it) { return aplica(it, u); }); }
  function noAplican(u) { return ITEMS.filter(function (it) { return !aplica(it, u); }).map(function (it) { return it.id; }); }
  // Clasificación única. sel: { id: true (conforme) | false (no conforme) } o { id: "ok" | "no" }.

    var lista = u ? aplicables(u) : ITEMS;
    var no = lista.filter(function (it) { var v = sel[it.id]; return v === false || v === "no"; });

    actualizar(el) {

      $("[data-cat]", el).innerHTML = `<b class="num">${n} de ${UNIDADES_CATALOGO.length}</b> unidades registradas${n < UNIDADES_CATALOGO.length ? ' \xB7 <span class="pill p-adv">Faltan unidades</span>' : ' \xB7 <span class="pill p-ok">Completo</span>'}`;
      $$("select[name=unidadAsignada]", el).forEach((s) => {
        if (document.activeElement !== s) {
          const v = s.value;
          s.innerHTML = opcionesAsignacion(v);
        }
      });
      const U = [...D.usuarios].sort((a, b) => ROLES.indexOf(a.rol) - ROLES.indexOf(b.rol) || String(a.codigo).localeCompare(String(b.codigo)));
      $("[data-t]", el).innerHTML = U.length ? `<table class="dt"><thead><tr><th>C\xF3digo</th><th>Nombre</th><th>Rol</th><th>Unidad</th><th>Estado</th></tr></thead><tbody>${U.map((u) => `<tr class="click" data-uid="${esc(u.id)}" tabindex="0"><td class="num"><b>${esc(u.codigo || "\u2014")}</b></td><td>${esc(u.nombre || "(sin nombre)")}${u.id === perfil.uid ? ' <span class="small muted">(usted)</span>' : ""}</td><td>${esc(ROL_NOMBRE[u.rol] || u.rol)}</td><td>${esc(u.unidadAsignada || "\u2014")}</td><td><span class="pill ${u.activo ? "p-ok" : "p-res"}">${u.activo ? "Activo" : "Inactivo"}</span></td></tr>`).join("")}</tbody></table>` : vacio("Sin usuarios registrados.", "users");
    }
  }
};
function pintarDiagnostico(el) {
  const yo = V.diagnostico, l = yo.ultima;
  $("[data-hist]", el).innerHTML = yo.lecturas.length ? `<table class="dt"><thead><tr><th>Hora</th><th>Unidad</th><th>Ciclo de ensayo</th><th>Clasificaci\xF3n del modelo</th><th class="n">Probabilidad</th><th>Condici\xF3n registrada en el ensayo</th><th>Orden</th></tr></thead><tbody>${yo.lecturas.map((r) => `<tr><td>${esc(fFecha(r.en))}</td><td class="num">${esc(r.u)}</td><td class="num">n.\xB0 ${r.k.id}</td><td><span class="pill ${["p-ok", "p-adv", "p-crit"][r.pred.clase]}">${CLASES[r.pred.clase]}</span></td><td class="n">${fNum(r.pred.confianza * 100)} %</td><td>${CLASES[r.k.bomba]}</td><td class="num">${esc(r.ot || "\u2014")}</td></tr>`).join("")}</tbody></table>` : vacio("Sin lecturas.");
  if (!l) {
    $("[data-var]", el).innerHTML = vacio("Lea un ciclo para ver sus variables.");
    return;
  }
  $("[data-sub]", el).textContent = `${l.u} \xB7 ciclo de laboratorio n.\xB0 ${l.k.id} \xB7 ${fFecha(l.en)}`;
  const tono = ["good", "warn", "crit"][l.pred.clase];
  $("[data-res]", el).innerHTML = `<div class="note ${tono}"><span class="small">El modelo clasifica</span><div class="cl">${CLASES[l.pred.clase]}</div><span class="small">Probabilidad ${fNum(l.pred.confianza * 100)} % \xB7 condici\xF3n registrada en el ensayo: ${CLASES[l.k.bomba].toLowerCase()}</span></div>
    <div class="bars">${l.pred.p.map((v, i) => `<div class="bar c${i}"><span>${CLASES[i]}</span><span class="m"><i style="width:${v * 100}%"></i></span><span class="n">${fNum(v * 100)} %</span></div>`).join("")}</div><div data-acc style="display:grid;gap:10px"></div>`;
  const M2 = medias();
  $("[data-var]", el).innerHTML = `<table class="dt var-t"><thead><tr><th>Variable</th><th class="n">Este ciclo</th><th class="n">Sin fuga</th><th class="n">Fuga d\xE9bil</th><th class="n">Fuga severa</th></tr></thead><tbody>${VARIABLES.map(([n, d, u, dec], j) => `<tr><td><b>${esc(n)}</b><br><span class="small muted">${esc(d)} (${esc(u)})</span></td><td class="n"><b>${fNum(l.k.x[j], dec)}</b></td>${[0, 1, 2].map((c) => `<td class="n">${fNum(M2[c][j], dec)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  pintarAccionModelo(el);
}
function pintarAccionModelo(el) {
  const yo = V.diagnostico, l = yo.ultima, box = $("[data-acc]", el);
  if (!l || !box) return;
  if (l.pred.clase === 0) {
    box.innerHTML = '<p class="small muted">Sin fuga: la unidad puede salir a ruta. No se requiere orden.</p>';
    return;
  }
  if (l.pred.clase === 1) {
    box.innerHTML = `<p class="small">Fuga d\xE9bil: se recomienda programar una revisi\xF3n. Si la confirma en la unidad, registre una inspecci\xF3n observada.</p>${puede(perfil.rol, "registrarInspeccion") ? '<button type="button" class="btn sec" data-ins>Registrar inspecci\xF3n observada</button>' : ""}`;
    const b = $("[data-ins]", box);
    if (b) b.onclick = () => ir("inspecciones", { unidadId: l.u, sistema: "Hidr\xE1ulico", condicion: "observada" });
    return;
  }
  const abierta = D.ordenes.find((o) => o.unidadId === l.u && o.origen === "modelo" && o.estado !== "resuelta");
  if (l.ot) {
    box.innerHTML = `<div class="note good small">Registr\xF3 la orden <b class="num">${esc(l.ot)}</b> a partir de esta lectura.</div>`;
    return;
  }
  if (abierta) {
    box.innerHTML = `<div class="note small">Ya est\xE1 abierta la orden <b class="num">${esc(abierta.codigo)}</b> del diagn\xF3stico para ${esc(l.u)} (${esc(ESTADOS[abierta.estado].toLowerCase())}). No se registra otra.</div>`;
    return;
  }
  if (!puede(perfil.rol, "generarOrdenModelo")) {
    box.innerHTML = '<p class="small">Comunique el resultado al mec\xE1nico de turno.</p>';
    return;
  }
  box.innerHTML = `<p class="small">Fuga severa en ${esc(l.u)}. La lectura es simulada: si decide actuar, registre la orden de prioridad alta para retirar la unidad de ruta e inspeccionar la bomba.</p><button type="button" class="btn" data-gen>${ic("wrench")}Registrar orden de prioridad alta</button>`;
  $("[data-gen]", box).onclick = async (e) => {
    const b = e.currentTarget;
    ocupado(b, true, "Registrando\u2026");
    try {
      const r = await crearOrdenModelo(perfil, { unidadId: l.u, cicloEnsayo: l.k.id, probabilidad: l.pred.confianza });
      l.ot = r.codigo;
      toast(`${r.codigo} registrada \xB7 ${l.u} sale de ruta.`, "crit");
      pintarDiagnostico($("#vista", root));
    } catch (err2) {
      toast(mensajeError(err2), "crit", 8e3);
      ocupado(b, false);
    }
  };
}
function matrizConfusion() {
  const m = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
  CICLOS.forEach((k) => {
    m[k.bomba][predecir(k.x).clase]++;
  });
  const { aciertos, total } = desempeno();
  return `<p><b class="num" style="font-size:1.6rem">${aciertos} de ${total}</b> ciclos bien clasificados (${fNum(aciertos / total * 100, 1)} %)</p>
    <div class="cm" role="table" aria-label="Matriz de confusi\xF3n: filas, condici\xF3n real; columnas, clasificaci\xF3n del modelo"><div class="h">Real \\ Modelo</div>${CLASES.map((c) => `<div class="h">${c}</div>`).join("")}
    ${m.map((f, i) => `<div class="h" style="text-align:left">${CLASES[i]}</div>${f.map((v, j) => `<div class="${i === j ? "d" : v ? "e" : ""}">${v}</div>`).join("")}`).join("")}</div>`;
}
var codigosUnidades = () => (D.unidades.length ? D.unidades : UNIDADES_CATALOGO).map((u) => u.codigo);
var opcionesAsignacion = (v) => '<option value="">Sin unidad</option>' + codigosUnidades().map((c) => `<option${c === v ? " selected" : ""}>${esc(c)}</option>`).join("");
function camposPerfil(d, yoMismo = false) {
  return `<div class="frow"><label class="f">Nombre<input name="nombre" value="${esc(d.nombre || "")}" autocomplete="off"></label><label class="f">C\xF3digo<input name="codigo" value="${esc(d.codigo || "")}" placeholder="CH-03" autocapitalize="characters" autocomplete="off"></label></div>
    <div class="frow"><label class="f">Rol<select name="rol" ${yoMismo ? "disabled" : ""}>${ROLES.map((r) => `<option value="${r}"${r === d.rol ? " selected" : ""}>${ROL_NOMBRE[r]}</option>`).join("")}</select></label>
    <label class="f" data-unidad-f>Unidad asignada<select name="unidadAsignada">${opcionesAsignacion(d.unidadAsignada)}</select></label></div>
    <label class="check"><input type="checkbox" name="activo" ${d.activo ? "checked" : ""} ${yoMismo ? "disabled" : ""}>Cuenta activa</label>
    ${yoMismo ? '<p class="small muted">No puede quitarse el rol de administrador ni desactivar su propia cuenta.</p>' : ""}`;
}
function enlazarCamposPerfil(f) {
  if (!f.rol) return;
  const sync = () => {
    const box = $("[data-unidad-f]", f);
    if (box) box.hidden = f.rol.value !== "chofer";
  };
  f.rol.onchange = sync;
  sync();
}
var leerPerfil = (f) => ({ rol: f.rol.value, activo: f.activo.checked, nombre: f.nombre.value, codigo: f.codigo.value.trim().toUpperCase(), unidadAsignada: f.rol.value === "chofer" ? f.unidadAsignada.value || null : null });
function editarUsuario(uid) {
  const u = D.usuarios.find((x) => x.id === uid);
  if (!u) return;
  const yo = uid === perfil.uid;
  abrirHoja(`Usuario ${u.codigo || ""}`.trim(), `<form novalidate style="display:grid;gap:12px"><p class="small muted">UID: <code>${esc(uid)}</code></p>${camposPerfil(u, yo)}<button class="btn" type="submit">Guardar cambios</button></form>`, (el, h2) => {
    const f = $("form", el);
    enlazarCamposPerfil(f);
    f.onsubmit = async (e) => {
      e.preventDefault();
      const d = leerPerfil(f);
      if (yo) {
        d.rol = "administrador";
        d.activo = true;
      }
      const errs = validarPerfil(d, codigosUnidades());
      if (Object.keys(errs).length) {
        marcarErrores(f, errs);
        return;
      }
      const b = $("button[type=submit]", f);
      ocupado(b, true, "Guardando\u2026");
      try {
        await guardarPerfil(perfil, uid, d, false);
        toast(`Usuario ${d.codigo} actualizado.`, "ok");
        cerrarHoja();
      } catch (err2) {
        toast(mensajeError(err2), "crit", 8e3);
        ocupado(b, false);
      }
    };
  });
}
function nuevaFalla() {
  abrirHoja("Registrar una falla", "", (el) => {
    formularioReporte(el, perfil, { origen: "tablet", unidades: D.unidades, onVer: (id) => {
      cerrarHoja();
      setTimeout(() => abrirOrden(id), 0);
    } });
  });
}
arrancar();
</script>
