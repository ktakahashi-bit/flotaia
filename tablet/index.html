/* ===== shared/common.css ===== */
/* FlotaIA · estilos compartidos por Mobile y Tablet.
   Mismo sistema visual que el escritorio V13 «Cinta reflectiva»: asfalto, concreto y amarillo de señalización. */
:root{
  color-scheme:light;
  --asfalto:#1F2A2E; --asfalto-2:#2A373C; --asfalto-3:#3A4A50;
  --concreto:#EDEFEB; --concreto-2:#E3E6E1; --blanco:#FFFFFF;
  --senal:#F2B300; --senal-hover:#DFA400; --senal-soft:#FFF4CF;
  --petroleo:#2B5D6E; --petroleo-soft:#E3EEF1;
  --surface:#FFFFFF; --surface-2:#F6F7F4;
  --ink:#1B2427; --ink-2:#34434A; --muted:#5C6A6F; --faint:#88959A;
  --line:#D6DAD4; --line-2:#C2C8C1;
  --good:#2F7A4E; --good-soft:#E3F1E8; --warn:#A86E0B; --warn-soft:#FBF0D9; --crit:#B83A2A; --crit-soft:#F8E4E0;
  --ia:#5B4BB7; --ia-soft:#ECE9F8; --auto:#2B5D6E; --auto-soft:#E3EEF1; --sim:#7A5A12; --sim-soft:#F5EDD8;
  --sans:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Semi Condensed","Barlow","Arial Narrow",sans-serif;
  --code:"IBM Plex Mono",Consolas,monospace;
  --chevron:repeating-linear-gradient(-45deg,var(--senal) 0 12px,var(--asfalto) 12px 24px);
  --r-sm:4px; --r:6px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--concreto);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--cond);color:var(--ink);margin:0;line-height:1.15}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--petroleo)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
::selection{background:var(--senal-soft)}
:where(a,button,select,input,textarea,[tabindex]):focus-visible{outline:2px solid var(--asfalto);outline-offset:2px;box-shadow:0 0 0 5px var(--senal)}

/* ---------- franja de MODO LOCAL: nunca se confunde con Firebase ---------- */
.modo-local{position:sticky;top:0;z-index:90;background:var(--crit);color:#fff;font-family:var(--cond);font-weight:700;font-size:.9rem;line-height:1.25;
  padding:calc(5px + var(--safe-t)) calc(12px + var(--safe-r)) 5px calc(12px + var(--safe-l));display:flex;gap:2px 10px;flex-wrap:wrap;align-items:center;justify-content:center;text-align:center}
.modo-local span{font-family:var(--sans);font-weight:500;font-size:.74rem;opacity:.95}
.modo-local button{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:var(--r-sm);font-size:.74rem;padding:1px 8px;cursor:pointer;font-family:var(--sans)}
@media (max-width:640px){.modo-local span{order:3;flex-basis:100%}}

/* ---------- barra superior con borde de cinta reflectiva ---------- */
.topbar{background:var(--asfalto);color:#fff;position:relative;padding:10px calc(16px + var(--safe-r)) 18px calc(16px + var(--safe-l));display:flex;align-items:center;gap:12px}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--chevron)}
.has-safe-top .topbar{padding-top:calc(10px + var(--safe-t))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.bname{font-family:var(--cond);font-size:1.35rem;font-weight:700;color:#fff;line-height:1}
.bname span{color:var(--senal)}
.bsub{font-size:.72rem;color:#A4B0AD;line-height:1.2;margin-top:2px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.chip-rol{font-family:var(--cond);font-size:.88rem;font-weight:600;background:var(--asfalto-3);color:#fff;border-radius:3px;padding:3px 8px;white-space:nowrap}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:var(--r-sm);border:1px solid #4B5B61;background:transparent;color:#E6EBE9;cursor:pointer}
.iconbtn:hover{background:var(--asfalto-2)}

/* indicador de conexión: solo describe lo que informa el SDK */
.conn{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:#D3DAD8;white-space:nowrap}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint)}
.conn.ok::before{background:#5FC28A}
.conn.cache::before{background:var(--senal)}
.conn.off::before{background:#F2A597}
.conn.local::before{background:#F2A597}

.proto-band{background:var(--sim-soft);color:var(--sim);font-size:.8rem;font-weight:600;padding:6px calc(16px + var(--safe-r)) 6px calc(16px + var(--safe-l));display:flex;flex-wrap:wrap;gap:2px 10px}
.proto-band b{font-family:var(--cond);font-weight:700}

/* ---------- superficies ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 12px;flex-wrap:wrap}
.card-h p{color:var(--muted);font-size:.86rem;margin-top:2px}
.eyebrow{font-size:.82rem;font-weight:600;color:var(--petroleo)}
.vhead{display:grid;gap:4px;margin-bottom:4px}
.vhead .lead{color:var(--ink-2);font-size:.95rem;max-width:70ch}
.foot{font-size:.8rem;color:var(--muted)}
.note{background:var(--surface-2);border-left:4px solid var(--petroleo);padding:10px 12px;font-size:.88rem;color:var(--ink-2)}
.note.crit{border-left-color:var(--crit);background:var(--crit-soft)}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.good{border-left-color:var(--good);background:var(--good-soft)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 16px;position:relative;display:grid;gap:2px;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:var(--r) 0 0 var(--r);background:var(--kc,var(--line-2))}
.kpi .l{font-size:.82rem;color:var(--muted)}
.kpi .v{font-family:var(--cond);font-size:1.9rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .m{font-size:.78rem;color:var(--muted)}
.kpi.crit{--kc:var(--crit)}.kpi.warn{--kc:var(--senal)}.kpi.good{--kc:var(--good)}.kpi.auto{--kc:var(--petroleo)}

/* ---------- botones y controles (objetivo táctil ≥ 44 px) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:var(--r-sm);
  background:var(--senal);border:1px solid var(--senal);color:var(--asfalto);font-family:var(--cond);font-size:1.05rem;font-weight:600;cursor:pointer;text-decoration:none;touch-action:manipulation}
.btn:hover{background:var(--senal-hover);border-color:var(--senal-hover)}
.btn.sec{background:var(--surface);border-color:var(--line-2);color:var(--asfalto)}
.btn.sec:hover{background:var(--surface-2);border-color:var(--asfalto)}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.btn.dark{background:var(--asfalto);border-color:var(--asfalto);color:#fff}
.btn.danger{background:var(--surface);color:var(--crit);border-color:#E2B4AC}
.btn.sm{min-height:38px;font-size:.95rem;padding:6px 12px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn .spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.f{display:grid;gap:5px;font-size:.9rem;font-weight:600;color:var(--ink-2);min-width:0}
.f .hint{font-weight:400;color:var(--muted);font-size:.8rem}
input,select,textarea{width:100%;min-height:46px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;padding:10px 12px;font-size:16px;font-weight:400;color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.45}
input:disabled,select:disabled{background:var(--surface-2);color:var(--muted)}
.f.has-err input,.f.has-err select,.f.has-err textarea{border-color:var(--crit);background:#FFFBFA}
.ferr{color:var(--crit);font-size:.82rem;font-weight:600;min-height:0}
.ferr:empty{display:none}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

function indicadorConexion(el, A) {

  const previo = document.activeElement;
  const cerrar = () => { bg.remove(); document.removeEventListener('keydown', tecla); if (onClose) onClose(); if (previo && previo.focus) previo.focus(); };
  const tecla = e => { if (e.key === 'Escape') cerrar(); };
  bg.addEventListener('click', e => { if (e.target === bg) cerrar(); });
  bg.querySelector('.sheet-h button').onclick = cerrar;
  document.addEventListener('keydown', tecla);
  document.body.append(bg);
  setTimeout(() => (bg.querySelector('.sheet-b [autofocus]') || bg.querySelector('.sheet-h button')).focus(), 0);
  return { el: bg.querySelector('.sheet-b'), cerrar };
}

        : `El perfil de ${esc(ROL_NOMBRE[p.rol].toLowerCase())} trabaja en el celular: reporte de fallas y seguimiento de sus reportes.`,

        setTimeout(() => {
          const c = [0, 0, 1, 2][(yo.n + Math.floor(Math.random() * 4)) % 4], L = porClase(c), k = L[Math.floor(Math.random() * 1000) % L.length];
          const pred = predecir(k.x); yo.n++;
          yo.ultima = { u, k, pred, en: new Date().toISOString(), ot: null };
          yo.lecturas.unshift(yo.ultima);
          ocupado(b, false); pintarDiagnostico(el);
          toast(`${u}: ${CLASES[pred.clase].toLowerCase()} (${fNum(pred.confianza * 100)} %).`, pred.clase === 2 ? 'crit' : '');
        }, 400);
      };
      pintarDiagnostico(el);
    },
    actualizar(el) { const yo = V.diagnostico; if (yo.ultima && yo.ultima.pred.clase === 2) pintarAccionModelo(el); },
  },
  indicadores: {
    montar(el) {
      el.innerHTML = `<div data-error></div><div class="note">Se calculan en este navegador solo con las órdenes e inspecciones registradas ${MODO_LOCAL ? 'en el modo local de prueba' : 'en Firestore'} durante la prueba del prototipo. No son resultados municipales ni mediciones reales de El Tambo.</div>
        <div class="kpis" data-k></div>
        <div class="g2"><section class="card"><div class="card-h"><h2>Órdenes abiertas por prioridad</h2></div><div class="bars" data-bp></div></section>
        <section class="card"><div class="card-h"><h2>Órdenes registradas por origen</h2></div><div class="bars" data-bo></div></section></div>
        <section class="card"><div class="card-h"><div><h2>Por unidad</h2><p>Horas declaradas por el mecánico al cerrar cada orden</p></div></div><div class="tw" data-t></div>
          <p class="foot">Reparación media registrada: promedio de las horas de reparación declaradas al cerrar las órdenes. Tiempo hasta la atención: desde el registro de la orden hasta que un mecánico la inicia (hora del servidor).</p></section>`;
    },
    actualizar(el) {
      const k = S.indicadores(D.ordenes, D.insp);
      $('[data-k]', el).innerHTML = [['', 'Órdenes registradas', k.total, ''], ['warn', 'Pendientes', k.pendientes, ''], ['auto', 'En atención', k.enAtencion, ''], ['good', 'Resueltas', k.resueltas, ''],
        ['', 'Tiempo medio hasta la atención', fHoras(k.horasHastaAtencion), ''], ['', 'Reparación media registrada', fHoras(k.mttrRegistrado), 'MTTR de las órdenes cerradas'],
        [k.unidadesFuera ? 'crit' : 'good', 'Rutas cubiertas ahora', `${k.rutasCubiertas} / 7`, ''], ['', 'Inspecciones', k.inspecciones, `${k.hallazgos} con hallazgos`], [k.hallazgosAbiertos ? 'warn' : '', 'Hallazgos con orden abierta', k.hallazgosAbiertos, '']]
        .map(([c, l, v, m]) => `<div class="kpi ${c}"><span class="l">${esc(l)}</span><span class="v">${esc(v)}</span>${m ? `<span class="m">${esc(m)}</span>` : ''}</div>`).join('');
      const barras = (filas, clase) => { const max = Math.max(1, ...filas.map(f => f[1])); return filas.map(([t, n], i) => `<div class="bar ${clase ? 'c' + i : ''}"><span>${esc(t)}</span><span class="m"><i style="width:${(n / max) * 100}%"></i></span><span class="n">${n}</span></div>`).join(''); };
      const p = k.abiertasPorPrioridad, o = k.porOrigen;
      $('[data-bp]', el).innerHTML = barras([['Baja', p.baja], ['Media', p.media], ['Alta', p.alta]], true);
      $('[data-bo]', el).innerHTML = barras([['Reporte de falla', o.incidencia], ['Inspección', o.inspeccion], ['Diagnóstico del modelo', o.modelo]], false);
      $('[data-t]', el).innerHTML = `<table class="dt"><thead><tr><th>Unidad</th><th>Ruta</th><th>Estado</th><th class="n">Abiertas</th><th class="n">Resueltas</th><th class="n">Horas de reparación</th><th class="n">Horas fuera de servicio</th></tr></thead><tbody>${S.UNIDADES_CATALOGO.map(u => {
        const L = D.ordenes.filter(x => x.unidadId === u.codigo), R = L.filter(x => x.estado === 'resuelta'), e = S.estadoUnidad(u.codigo, D.ordenes);
        const suma = c => R.reduce((s, x) => s + (Number(x[c]) || 0), 0);
        return `<tr class="click" data-unidad="${u.codigo}"><td class="num"><b>${u.codigo}</b></td><td>${esc(u.ruta || '—')}</td><td><span class="pill ${['p-ok', 'p-adv', 'p-crit'][e.nivel]}">${esc(e.texto)}</span></td><td class="n">${L.length - R.length}</td><td class="n">${R.length}</td><td class="n">${fNum(suma('horasReparacion'), 1)}</td><td class="n">${fNum(suma('horasParada'), 1)}</td></tr>`;
      }).join('')}</tbody></table>`;
    },
  },
  usuarios: {
    montar(el) {
      el.innerHTML = `<div data-error></div><div class="g2">
        <section class="card"><div class="card-h"><div><h2>Catálogo de unidades</h2><p>Unidades del caso simulado guardadas en la base de datos</p></div></div><p data-cat></p>
          <button type="button" class="btn sec" data-cat-b>Crear las unidades que faltan</button>
          <p class="foot">Crea C-01 a C-07 (compactadoras, rutas R-01 a R-07) y B-01 (camión baranda) con identificador fijo y la marca «simulado». Puede pulsarlo más de una vez: no duplica unidades.</p></section>
        <form class="card" novalidate data-nuevo><div class="card-h"><div><h2>Crear usuario</h2><p>Cuenta de acceso y perfil en un solo paso</p></div></div>
          <div class="frow"><label class="f">Correo<input name="email" type="email" autocomplete="off" autocapitalize="off" spellcheck="false"></label><label class="f">Contraseña temporal<input name="password" type="text" autocomplete="new-password" spellcheck="false" minlength="8"></label></div>
          ${camposPerfil({ rol: 'chofer', activo: true })}
          <button class="btn" type="submit">${ic('users')}Crear usuario</button>
          <p class="foot">La cuenta se crea en Firebase Authentication con una sesión secundaria: su sesión de administrador no se cierra. Entregue la contraseña temporal por un canal seguro y pida cambiarla.</p></form></div>
        <section class="card"><div class="card-h"><div><h2>Usuarios registrados</h2><p>Toque un usuario para cambiar su rol, su unidad o desactivarlo</p></div></div><div class="tw" data-t></div></section>
        <form class="card" novalidate data-existente><div class="card-h"><div><h2>Registrar el perfil de una cuenta existente</h2><p>Para cuentas creadas en la consola de Firebase (Authentication &gt; Usuarios &gt; UID)</p></div></div>
          <label class="f">UID de la cuenta<input name="uid" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
          ${camposPerfil({ rol: 'chofer', activo: true })}
          <button class="btn sec" type="submit">Registrar perfil</button></form>`;
      $('[data-cat-b]', el).onclick = async e => {
        const b = e.currentTarget; ocupado(b, true, 'Revisando…');
        try { const r = await S.inicializarCatalogo(perfil); toast(r.creadas ? `Se crearon ${r.creadas} unidad(es).` : 'El catálogo ya estaba completo.', 'ok'); }
        catch (err) { toast(mensajeError(err), 'crit', 8000); } finally { ocupado(b, false); }
      };
      $$('form', el).forEach(enlazarCamposPerfil);
      const fN = $('[data-nuevo]', el);
      fN.onsubmit = async e => {
        e.preventDefault(); const d = leerPerfil(fN); d.email = fN.email.value.trim(); d.password = fN.password.value;
        const errs = S.validarPerfil(d, codigosUnidades()); if (!/^\S+@\S+\.\S+$/.test(d.email)) errs.email = 'Correo no válido.'; if (d.password.length < 8) errs.password = 'Mínimo 8 caracteres.';
        if (Object.keys(errs).length) { marcarErrores(fN, errs); return; }
        marcarErrores(fN, {}); const b = $('button[type=submit]', fN); ocupado(b, true, 'Creando…');
        try { await S.crearUsuario(perfil, d); toast(`Usuario ${d.codigo} creado.`, 'ok'); fN.reset(); enlazarCamposPerfil(fN); }
        catch (err) { if (err.campos) marcarErrores(fN, err.campos); toast(mensajeError(err), 'crit', 8000); } finally { ocupado(b, false); }
      };
      const fE = $('[data-existente]', el);
      fE.onsubmit = async e => {
        e.preventDefault(); const d = leerPerfil(fE), uid = fE.uid.value.trim();
        const errs = S.validarPerfil(d, codigosUnidades()); if (!/^[A-Za-z0-9_-]{6,128}$/.test(uid)) errs.uid = 'Pegue el UID tal como aparece en la consola.';
        if (D.usuarios.some(u => u.id === uid)) errs.uid = 'Ese UID ya tiene perfil: edítelo en la lista.';
        if (Object.keys(errs).length) { marcarErrores(fE, errs); return; }
        marcarErrores(fE, {}); const b = $('button[type=submit]', fE); ocupado(b, true, 'Guardando…');
        try { await S.guardarPerfil(perfil, uid, d, true); toast(`Perfil ${d.codigo} registrado.`, 'ok'); fE.reset(); enlazarCamposPerfil(fE); }
        catch (err) { toast(mensajeError(err), 'crit', 8000); } finally { ocupado(b, false); }
      };
      $('[data-t]', el).addEventListener('click', e => { const r = e.target.closest('[data-uid]'); if (r) editarUsuario(r.dataset.uid); });
    },
    actualizar(el) {
      const n = D.unidades.length;
      $('[data-cat]', el).innerHTML = `<b class="num">${n} de ${S.UNIDADES_CATALOGO.length}</b> unidades registradas${n < S.UNIDADES_CATALOGO.length ? ' · <span class="pill p-adv">Faltan unidades</span>' : ' · <span class="pill p-ok">Completo</span>'}`;
      $$('select[name=unidadAsignada]', el).forEach(s => { if (document.activeElement !== s) { const v = s.value; s.innerHTML = opcionesAsignacion(v); } });
      const U = [...D.usuarios].sort((a, b) => ROLES.indexOf(a.rol) - ROLES.indexOf(b.rol) || String(a.codigo).localeCompare(String(b.codigo)));
      $('[data-t]', el).innerHTML = U.length ? `<table class="dt"><thead><tr><th>Código</th><th>Nombre</th><th>Rol</th><th>Unidad</th><th>Estado</th></tr></thead><tbody>${U.map(u => `<tr class="click" data-uid="${esc(u.id)}" tabindex="0"><td class="num"><b>${esc(u.codigo || '—')}</b></td><td>${esc(u.nombre || '(sin nombre)')}${u.id === perfil.uid ? ' <span class="small muted">(usted)</span>' : ''}</td><td>${esc(ROL_NOMBRE[u.rol] || u.rol)}</td><td>${esc(u.unidadAsignada || '—')}</td><td><span class="pill ${u.activo ? 'p-ok' : 'p-res'}">${u.activo ? 'Activo' : 'Inactivo'}</span></td></tr>`).join('')}</tbody></table>` : vacio('Sin usuarios registrados.', 'users');
    },
  },
};

// ---------- diagnóstico: pintado ----------
function pintarDiagnostico(el) {
  const yo = V.diagnostico, l = yo.ultima;
  $('[data-hist]', el).innerHTML = yo.lecturas.length ? `<table class="dt"><thead><tr><th>Hora</th><th>Unidad</th><th>Ciclo de ensayo</th><th>Clasificación del modelo</th><th class="n">Probabilidad</th><th>Condición registrada en el ensayo</th><th>Orden</th></tr></thead><tbody>${yo.lecturas.map(r => `<tr><td>${esc(fFecha(r.en))}</td><td class="num">${esc(r.u)}</td><td class="num">n.° ${r.k.id}</td><td><span class="pill ${['p-ok', 'p-adv', 'p-crit'][r.pred.clase]}">${CLASES[r.pred.clase]}</span></td><td class="n">${fNum(r.pred.confianza * 100)} %</td><td>${CLASES[r.k.bomba]}</td><td class="num">${esc(r.ot || '—')}</td></tr>`).join('')}</tbody></table>` : vacio('Sin lecturas.');
  if (!l) { $('[data-var]', el).innerHTML = vacio('Lea un ciclo para ver sus variables.'); return; }
  $('[data-sub]', el).textContent = `${l.u} · ciclo de laboratorio n.° ${l.k.id} · ${fFecha(l.en)}`;
  const tono = ['good', 'warn', 'crit'][l.pred.clase];
  $('[data-res]', el).innerHTML = `<div class="note ${tono}"><span class="small">El modelo clasifica</span><div class="cl">${CLASES[l.pred.clase]}</div><span class="small">Probabilidad ${fNum(l.pred.confianza * 100)} % · condición registrada en el ensayo: ${CLASES[l.k.bomba].toLowerCase()}</span></div>
    <div class="bars">${l.pred.p.map((v, i) => `<div class="bar c${i}"><span>${CLASES[i]}</span><span class="m"><i style="width:${v * 100}%"></i></span><span class="n">${fNum(v * 100)} %</span></div>`).join('')}</div><div data-acc style="display:grid;gap:10px"></div>`;
  const M = medias();
  $('[data-var]', el).innerHTML = `<table class="dt var-t"><thead><tr><th>Variable</th><th class="n">Este ciclo</th><th class="n">Sin fuga</th><th class="n">Fuga débil</th><th class="n">Fuga severa</th></tr></thead><tbody>${VARIABLES.map(([n, d, u, dec], j) => `<tr><td><b>${esc(n)}</b><br><span class="small muted">${esc(d)} (${esc(u)})</span></td><td class="n"><b>${fNum(l.k.x[j], dec)}</b></td>${[0, 1, 2].map(c => `<td class="n">${fNum(M[c][j], dec)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  pintarAccionModelo(el);
}
function pintarAccionModelo(el) {
  const yo = V.diagnostico, l = yo.ultima, box = $('[data-acc]', el); if (!l || !box) return;
  if (l.pred.clase === 0) { box.innerHTML = '<p class="small muted">Sin fuga: la unidad puede salir a ruta. No se requiere orden.</p>'; return; }
  if (l.pred.clase === 1) {
    box.innerHTML = `<p class="small">Fuga débil: se recomienda programar una revisión. Si la confirma en la unidad, registre una inspección observada.</p>${puede(perfil.rol, 'registrarInspeccion') ? '<button type="button" class="btn sec" data-ins>Registrar inspección observada</button>' : ''}`;
    const b = $('[data-ins]', box); if (b) b.onclick = () => ir('inspecciones', { unidadId: l.u, sistema: 'Hidráulico', condicion: 'observada' });
    return;
  }
  const abierta = D.ordenes.find(o => o.unidadId === l.u && o.origen === 'modelo' && o.estado !== 'resuelta');
  if (l.ot) { box.innerHTML = `<div class="note good small">Registró la orden <b class="num">${esc(l.ot)}</b> a partir de esta lectura.</div>`; return; }
  if (abierta) { box.innerHTML = `<div class="note small">Ya está abierta la orden <b class="num">${esc(abierta.codigo)}</b> del diagnóstico para ${esc(l.u)} (${esc(S.ESTADOS[abierta.estado].toLowerCase())}). No se registra otra.</div>`; return; }
  if (!puede(perfil.rol, 'generarOrdenModelo')) { box.innerHTML = '<p class="small">Comunique el resultado al mecánico de turno.</p>'; return; }
  box.innerHTML = `<p class="small">Fuga severa en ${esc(l.u)}. La lectura es simulada: si decide actuar, registre la orden de prioridad alta para retirar la unidad de ruta e inspeccionar la bomba.</p><button type="button" class="btn" data-gen>${ic('wrench')}Registrar orden de prioridad alta</button>`;
  $('[data-gen]', box).onclick = async e => {
    const b = e.currentTarget; ocupado(b, true, 'Registrando…');
    try { const r = await S.crearOrdenModelo(perfil, { unidadId: l.u, cicloEnsayo: l.k.id, probabilidad: l.pred.confianza }); l.ot = r.codigo; toast(`${r.codigo} registrada · ${l.u} sale de ruta.`, 'crit'); pintarDiagnostico($('#vista', root)); }
    catch (err) { toast(mensajeError(err), 'crit', 8000); ocupado(b, false); }
  };
}
function matrizConfusion() {
  const m = [[0, 0, 0], [0, 0, 0], [0, 0, 0]]; CICLOS.forEach(k => { m[k.bomba][predecir(k.x).clase]++; });
  const { aciertos, total } = desempeno();
  return `<p><b class="num" style="font-size:1.6rem">${aciertos} de ${total}</b> ciclos bien clasificados (${fNum(aciertos / total * 100, 1)} %)</p>
    <div class="cm" role="table" aria-label="Matriz de confusión: filas, condición real; columnas, clasificación del modelo"><div class="h">Real \\ Modelo</div>${CLASES.map(c => `<div class="h">${c}</div>`).join('')}
    ${m.map((f, i) => `<div class="h" style="text-align:left">${CLASES[i]}</div>${f.map((v, j) => `<div class="${i === j ? 'd' : v ? 'e' : ''}">${v}</div>`).join('')}`).join('')}</div>`;
}

// ---------- usuarios: formularios ----------
const codigosUnidades = () => (D.unidades.length ? D.unidades : S.UNIDADES_CATALOGO).map(u => u.codigo);
const opcionesAsignacion = v => '<option value="">Sin unidad</option>' + codigosUnidades().map(c => `<option${c === v ? ' selected' : ''}>${esc(c)}</option>`).join('');
function camposPerfil(d, yoMismo = false) {
  return `<div class="frow"><label class="f">Nombre<input name="nombre" value="${esc(d.nombre || '')}" autocomplete="off"></label><label class="f">Código<input name="codigo" value="${esc(d.codigo || '')}" placeholder="CH-03" autocapitalize="characters" autocomplete="off"></label></div>
    <div class="frow"><label class="f">Rol<select name="rol" ${yoMismo ? 'disabled' : ''}>${ROLES.map(r => `<option value="${r}"${r === d.rol ? ' selected' : ''}>${ROL_NOMBRE[r]}</option>`).join('')}</select></label>
    <label class="f" data-unidad-f>Unidad asignada<select name="unidadAsignada">${opcionesAsignacion(d.unidadAsignada)}</select></label></div>
    <label class="check"><input type="checkbox" name="activo" ${d.activo ? 'checked' : ''} ${yoMismo ? 'disabled' : ''}>Cuenta activa</label>
    ${yoMismo ? '<p class="small muted">No puede quitarse el rol de administrador ni desactivar su propia cuenta.</p>' : ''}`;
}
function enlazarCamposPerfil(f) {
  if (!f.rol) return;
  const sync = () => { const box = $('[data-unidad-f]', f); if (box) box.hidden = f.rol.value !== 'chofer'; };
  f.rol.onchange = sync; sync();
}
const leerPerfil = f => ({ rol: f.rol.value, activo: f.activo.checked, nombre: f.nombre.value, codigo: f.codigo.value.trim().toUpperCase(), unidadAsignada: f.rol.value === 'chofer' ? (f.unidadAsignada.value || null) : null });
function editarUsuario(uid) {
  const u = D.usuarios.find(x => x.id === uid); if (!u) return;
  const yo = uid === perfil.uid;
  abrirHoja(`Usuario ${u.codigo || ''}`.trim(), `<form novalidate style="display:grid;gap:12px"><p class="small muted">UID: <code>${esc(uid)}</code></p>${camposPerfil(u, yo)}<button class="btn" type="submit">Guardar cambios</button></form>`, (el, h) => {
    const f = $('form', el); enlazarCamposPerfil(f);
    f.onsubmit = async e => {
      e.preventDefault(); const d = leerPerfil(f); if (yo) { d.rol = 'administrador'; d.activo = true; }
      const errs = S.validarPerfil(d, codigosUnidades()); if (Object.keys(errs).length) { marcarErrores(f, errs); return; }
      const b = $('button[type=submit]', f); ocupado(b, true, 'Guardando…');
      try { await S.guardarPerfil(perfil, uid, d, false); toast(`Usuario ${d.codigo} actualizado.`, 'ok'); cerrarHoja(); }
      catch (err) { toast(mensajeError(err), 'crit', 8000); ocupado(b, false); }
    };
  });
}

// ---------- registrar falla desde la tablet ----------
function nuevaFalla() {
  abrirHoja('Registrar una falla', '', el => { formularioReporte(el, perfil, { origen: 'tablet', unidades: D.unidades, onVer: id => { cerrarHoja(); setTimeout(() => abrirOrden(id), 0); } }); });
}

arrancar();
return {  };
})();

// Manifiesto opcional: solo se enlaza si está publicado junto a esta página.
fetch('manifest.webmanifest', { method: 'HEAD', cache: 'no-store' }).then(r => { if (r.ok) { const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.append(l); } }).catch(() => {});
// En el modo local de prueba se exponen los módulos para las pruebas automáticas (no se hace con Firebase).
if (new URLSearchParams(location.search).get('modo') === 'local') window.__FLOTAIA_MODULOS__ = __M;
